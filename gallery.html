<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Applications and Projects — humming[bird]Tech</title>
    <link rel="stylesheet" href="style.css?v=20261112-wordmark-5" />
    <link rel="shortcut icon" href="https://uploads.onecompiler.io/447kr4gf2/44f9wbztv/humming%5Bbird%5DTech%20logo%20(4).png">
</head>
  <body class="gallery-body">

    <main class="home-page-main">
      <h1>Applications and projects</h1>
      <p class="content">Explore the applications and projects in the collection.</p>

    <div class="search-container">
      <input type="text" id="gallerySearch" placeholder="Search applications..." class="search-bar">
      <button class="utility-btn" onclick="clearGalleryFilters()" style="padding: 8px 24px;">Clear</button>
    </div>

    <div class="gallery-container" id="galleryContainer">
      <p id="loadingText">Processing source indexes...</p>
    </div>

    <div id="appViewportOverlay" class="app-viewport-overlay">
      <div class="viewport-navbar">
        <h3 id="viewportTitle" class="viewport-title">Application Sandbox</h3>
        <div class="viewport-controls">
          <button id="viewNewTabBtn" class="utility-btn">New Tab</button>
          <button id="viewAboutBlankBtn" class="utility-btn">about:blank</button>
          <button class="utility-btn" onclick="closeApplicationViewport()">Close</button>
        </div>
      </div>
      <div class="iframe-sandbox-container">
        <iframe id="appSandboxIframe" class="app-iframe" src=""></iframe>
      </div>
    </div>

    </main>
    <script src="global-utils.js?v=20261112-wordmark-5"></script>
    <script>
      const container = document.getElementById('galleryContainer');
      const searchBar = document.getElementById('gallerySearch');
      let projectsData = [];

      async function resolveRawLinkRegistryMap() {
        try {
          const response = await fetch('/html/repos.json');
          if (!response.ok) throw new Error('Data map configuration file missing');
          
          let data;
          try { data = await response.json(); } catch(jsonErr) {
            throw new Error('JSON format error in repos.json! Make sure commas are correct.');
          }
          
          if (!data || !data.repo_links) {
            throw new Error('JSON map lacks the "repo_links" entry list.');
          }

          const parsedRepos = data.repo_links.map(link => {
            let cleanLink = link.trim();
            if (!cleanLink.startsWith('http://') && !cleanLink.startsWith('https://')) {
              cleanLink = 'https://' + cleanLink;
            }

            let username = "hummingbird-9";
            let repoName = "unresolved-repo";
            let branch = null;

            try {
              const urlObj = new URL(cleanLink);
              const paths = urlObj.pathname.split('/').filter(p => p.trim());
              
              if (paths.length >= 2) {
                username = paths[0];
                repoName = paths[1];
                // Honor an explicitly supplied GitHub branch URL such as /tree/main.
                if (paths[2] === 'tree' && paths[3]) {
                  branch = decodeURIComponent(paths[3]);
                }
              }
            } catch (urlError) {
              console.error("Skipped malformed repository URL layout entry:", cleanLink);
            }

            return { username, repoName, branch };
          });

          let liveMetaMap = {};
          try {
            const apiRes = await fetch(`https://api.github.com/users/hummingbird-9/repos?per_page=100`);
            if (apiRes.ok) {
              const apiData = await apiRes.json();
              apiData.forEach(r => {
                liveMetaMap[r.name.toLowerCase()] = {
                  description: r.description || '',
                  defaultBranch: r.default_branch || 'main'
                };
              });
            }
          } catch (apiErr) {
            console.warn("GitHub API meta sync fallback active.");
          }

          projectsData = parsedRepos.map(info => {
            const parsedTitle = info.repoName.replace(/-/g, ' ');
            const lookKey = info.repoName.toLowerCase();
            const repoMeta = liveMetaMap[lookKey] || {};
            // Use an explicit /tree/branch from repos.json when present; otherwise
            // use the repository's actual default branch from the GitHub API.
            const branch = info.branch || repoMeta.defaultBranch || 'main';
            const cdnRoot = `https://cdn.jsdelivr.net/gh/${info.username}/${info.repoName}@${encodeURIComponent(branch)}/`;
            const computedCover = `${cdnRoot}cover.png`;
            // Use the HTTPS origin that is serving this gallery for each project's
            // GitHub Pages path. This keeps custom GitHub Pages domains (such as
            // ghp.hummingbird.rf.gd) on HTTPS instead of following old HTTP links.
            const appUrl = new URL(`/${encodeURIComponent(info.repoName)}/`, window.location.origin).href;
            const dynamicDesc = repoMeta.description || "Automated isolated application target interface deployment framework.";

            return {
              name: parsedTitle,
              cover: computedCover,
              thumbnailRoot: cdnRoot,
              backupAvatar: `https://github.com/${encodeURIComponent(info.username)}.png?size=256`,
              url: appUrl,
              description: dynamicDesc
            };
          });
          
          renderGalleryExecutionBlocks(projectsData);
        } catch (error) {
          console.error(error);
          container.innerHTML = `<p style="color: #ff6b6b; font-weight: bold; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 6px;">${error.message}</p>`;
        }
      }

      function renderGalleryExecutionBlocks(projects) {
        const fragment = document.createDocumentFragment();
        container.innerHTML = "";

        if (projects.length === 0) {
          container.innerHTML = `<p>No items match current filter criteria.</p>`;
          return;
        }

        projects.forEach(project => {
          const card = document.createElement('div');
          card.className = 'game-card';
          card.onclick = () => launchApplicationViewport(project.url, project.name);

          // Try common thumbnail names on the correct jsDelivr GitHub CDN path.
          // If a repository has no image, show the owner's GitHub avatar.
          const img = document.createElement('img');
          img.className = 'game-thumbnail';
          img.alt = `${project.name} thumbnail`;
          img.loading = 'lazy';
          img.decoding = 'async';
          const thumbnailNames = ['cover.png', 'Cover.png', 'thumbnail.png', 'icon.png', 'assets/cover.png'];
          let thumbnailIndex = 0;
          img.onerror = () => {
            thumbnailIndex++;
            if (thumbnailIndex < thumbnailNames.length) {
              img.src = project.thumbnailRoot + thumbnailNames[thumbnailIndex];
            } else {
              img.onerror = null;
              img.src = project.backupAvatar;
            }
          };
          img.src = project.cover;

          const heading = document.createElement('h3');
          heading.textContent = project.name;
          const description = document.createElement('p');
          description.textContent = project.description;
          card.appendChild(img);
          card.appendChild(heading);
          card.appendChild(description);
          fragment.appendChild(card);
        });
        container.appendChild(fragment);
      }

      function clearGalleryFilters() {
        searchBar.value = "";
        renderGalleryExecutionBlocks(projectsData);
      }

      function getGameIframe() {
        let iframe = document.getElementById('appSandboxIframe');
        if (!iframe) {
          const frameContainer = document.querySelector('.iframe-sandbox-container');
          iframe = document.createElement('iframe');
          iframe.id = 'appSandboxIframe';
          iframe.className = 'app-iframe';
          iframe.title = 'Application Sandbox';
          iframe.src = 'about:blank';
          frameContainer.appendChild(iframe);
        }
        return iframe;
      }

      function getSecureGameUrl(rawUrl) {
        const target = new URL(rawUrl, window.location.href);
        // Never assign an HTTP iframe URL from an HTTPS gallery.
        if (window.location.protocol === 'https:' && target.protocol === 'http:') {
          target.protocol = 'https:';
        }
        return target.href;
      }

      function launchApplicationViewport(rawUrl, title) {
        const url = getSecureGameUrl(rawUrl);
        document.getElementById('viewportTitle').innerText = title;
        const iframe = getGameIframe();
        iframe.src = url;
        document.getElementById('appViewportOverlay').style.display = 'flex';

        document.getElementById('viewNewTabBtn').onclick = () => {
          window.open(url, '_blank', 'noopener,noreferrer');
        };
        document.getElementById('viewAboutBlankBtn').onclick = () => {
          const blankWindow = window.open('about:blank', '_blank');
          if (blankWindow) {
            const safeTitle = String(title).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
            const safeUrl = url.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
            blankWindow.document.open();
            blankWindow.document.write(`
              <!doctype html>
              <html style="margin:0;padding:0;overflow:hidden;">
                <head><meta name="viewport" content="width=device-width,initial-scale=1"><title>${safeTitle}</title></head>
                <body style="margin:0;padding:0;overflow:hidden;background:#000;">
                  <iframe src="${safeUrl}" style="width:100vw;height:100vh;border:none;margin:0;padding:0;"></iframe>
                </body>
              </html>
            `);
            blankWindow.document.close();
          }
        };
      }

      function closeApplicationViewport() {
        const overlay = document.getElementById('appViewportOverlay');
        const iframe = document.getElementById('appSandboxIframe');
        // Removing the iframe destroys its browsing context. This stops the game's
        // JavaScript, WebAssembly instance, audio, timers, and page-owned workers.
        // Navigating to about:blank first also initiates cancellation of in-flight loads.
        if (iframe) {
          try { iframe.src = 'about:blank'; } catch (e) { /* removal below is the important cleanup */ }
          iframe.remove();
        }
        overlay.style.display = 'none';
      }

      searchBar.addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase();
        const filtered = projectsData.filter(project => {
          return project.name.toLowerCase().includes(searchTerm) || project.description.toLowerCase().includes(searchTerm);
        });
        renderGalleryExecutionBlocks(filtered);
      });

      resolveRawLinkRegistryMap();
    </script>
  </body>
</html>
