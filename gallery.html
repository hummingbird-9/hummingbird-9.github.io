<!DOCTYPE html>
<html>
  <head>
    <title>HTML Gallery</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="https://uploads.onecompiler.io/447kr4gf2/44f9wbztv/humming%5Bbird%5DTech%20logo%20(4).png">
    <style>
      /* 4-COLUMN ROW DYNAMICS: Shrinks the grid parameters down to align exactly 4 items per row */
      .game-card {
        flex-basis: calc(25% - 20px) !important;
        max-width: 240px !important;
        min-width: 180px !important;
        padding: 12px !important;
        box-sizing: border-box !important;
      }
      .game-thumbnail {
        height: 115px !important;
        margin-bottom: 8px !important;
      }
      .game-card h3 {
        font-size: 1.05rem !important;
        margin-bottom: 4px !important;
      }
      .game-card p {
        font-size: 0.85rem !important;
        line-height: 1.3 !important;
      }
    </style>
  </head>
  <body class="gallery-body">

    <div class="top-button-container">
      <a href="index.html" class="open-page-btn back-btn">← Back Home</a>
      <a href="https://github.com/hummingbird-9/hummingbird-9.github.io/issues" target="_blank" class="open-page-btn" style="border-color: rgba(255, 95, 86, 0.4);">Report An Issue</a>
    </div>

    <div class="utility-controls-container">
      <button class="utility-btn" onclick="toggleHardwareProfilerOverlay()">Hardware HUD</button>
      <button id="lightweightToggleBtn" class="utility-btn" onclick="toggleLightweightEngine()">Extreme Lightweight</button>
      <button id="themeToggleBtn" class="utility-btn" onclick="toggleTheme()">Theme Mode</button>
    </div>

    <div class="logo-container gallery-logo-container">
      <img src="https://uploads.onecompiler.io/447kr4gf2/44f9wbztv/humming%5Bbird%5DTech%20logo%20(4).png" alt="Humming[bird]Tech Logo" class="brand-logo">
    </div>

    <p class="content"></p>

    <div class="search-container">
      <input type="text" id="gallerySearch" placeholder="Search applications..." class="search-bar">
      <button class="utility-btn" onclick="clearGalleryFilters()" style="padding: 8px 24px;">Clear</button>
    </div>

    <div class="gallery-container" id="galleryContainer">
      <p id="loadingText">Processing source indexes...</p>
    </div>

    <div id="appViewportOverlay" class="app-viewport-overlay">
      <div class="viewport-navbar">
        <h3 id="viewportTitle" class="viewport-title">Application Sandbox</h3>
        <div class="viewport-controls">
          <button id="viewNewTabBtn" class="utility-btn">New Tab</button>
          <button id="viewAboutBlankBtn" class="utility-btn">GitHub Repo</button>
          <button class="utility-btn" style="background:#ff5f56; color:white;" onclick="closeApplicationViewport()">Close</button>
        </div>
      </div>
      <div class="iframe-sandbox-container">
        <iframe id="appSandboxIframe" class="app-iframe" src=""></iframe>
      </div>
    </div>

    <script src="global-utils.js"></script>
    <script>
      const container = document.getElementById('galleryContainer');
      const searchBar = document.getElementById('gallerySearch');
      let projectsData = [];

      // CDN files are fetched as data. HTML is placed in srcdoc because jsDelivr
      // deliberately serves .html files as text/plain rather than web pages.
      const htmlEntryNames = ['index.html', 'Index.html', 'index.htm', 'game.html'];
      const htmlCache = new Map();
      const repoPath = (project) => `${project.username}/${project.repoName}`;
      const cdnRoot = (project) => `https://cdn.jsdelivr.net/gh/${repoPath(project)}@${encodeURIComponent(project.branch)}/`;

      async function resolveRawLinkRegistryMap() {
        try {
          // Relative URL supports subdirectories, local HTTP servers and GitHub Pages.
          const response = await fetch('html/repos.json');
          if (!response.ok) throw new Error('Cannot load html/repos.json; use a local HTTP server instead of file://.');
          const data = await response.json();
          if (!Array.isArray(data.repo_links)) throw new Error('repos.json must contain a repo_links array.');

          const seen = new Set();
          const repos = data.repo_links.flatMap(raw => {
            try {
              const url = new URL(raw.trim());
              if (url.hostname.toLowerCase() !== 'github.com') return [];
              const [username, rawRepo] = url.pathname.split('/').filter(Boolean);
              if (!username || !rawRepo) return [];
              const repoName = rawRepo.replace(/\.git$/, '');
              const key = `${username}/${repoName}`.toLowerCase();
              if (seen.has(key)) return [];
              seen.add(key);
              return [{ username, repoName, branch: 'main',
                name: repoName.replace(/-/g, ' '),
                description: 'Launch this application directly from its repository files.',
                githubPagesUrl: `https://${username}.github.io/${repoName}/` }];
            } catch (err) { console.warn('Invalid repository URL:', raw, err); return []; }
          });
          projectsData = repos;
          renderGalleryExecutionBlocks(projectsData);

          // Metadata is optional: gallery displays immediately even when GitHub API
          // rate limits are reached. Default branches aren't always called main.
          try {
            const apiRes = await fetch('https://api.github.com/users/hummingbird-9/repos?per_page=100');
            if (apiRes.ok) {
              const metadata = await apiRes.json();
              const lookup = new Map(metadata.map(r => [r.name.toLowerCase(), r]));
              repos.forEach(project => {
                const info = lookup.get(project.repoName.toLowerCase());
                if (info) {
                  project.branch = info.default_branch || 'main';
                  project.description = info.description || project.description;
                }
              });
              renderGalleryExecutionBlocks(projectsData);
            }
          } catch (err) { console.warn('Optional GitHub metadata unavailable:', err); }
        } catch (error) {
          console.error(error);
          container.textContent = 'Gallery error: ' + error.message;
        }
      }

      function applyThumbnail(img, project) {
        // Prefer actual repository cover art. Missing covers become the GitHub
        // profile image, which is a valid URL (rather than an invalid hostname).
        const root = cdnRoot(project);
        const paths = ['cover.png', 'Cover.png', 'thumbnail.png', 'icon.png', 'assets/cover.png'];
        let next = 0;
        img.onerror = () => {
          if (next < paths.length) {
            img.src = root + paths[next++];
          } else {
            img.onerror = null;
            img.src = `https://github.com/${encodeURIComponent(project.username)}.png?size=256`;
          }
        };
        img.onerror();
      }

      function renderGalleryExecutionBlocks(projects) {
        const fragment = document.createDocumentFragment();
        container.replaceChildren();
        if (!projects.length) {
          container.textContent = 'No items match current filter criteria.';
          return;
        }
        for (const project of projects) {
          const card = document.createElement('div');
          card.className = 'game-card';
          card.tabIndex = 0;
          card.setAttribute('role', 'button');
          const img = document.createElement('img');
          img.className = 'game-thumbnail';
          img.alt = `${project.name} cover`;
          img.loading = 'lazy';
          applyThumbnail(img, project);
          const title = document.createElement('h3');
          title.textContent = project.name;
          const desc = document.createElement('p');
          desc.textContent = project.description;
          card.append(img, title, desc);
          card.onclick = () => launchApplicationViewport(project);
          card.onkeydown = (event) => {
            if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); card.click(); }
          };
          fragment.appendChild(card);
        }
        container.appendChild(fragment);
      }

      function clearGalleryFilters() {
        searchBar.value = '';
        renderGalleryExecutionBlocks(projectsData);
      }

      async function loadRepositoryHtml(project) {
        const key = `${repoPath(project)}@${project.branch}`;
        if (htmlCache.has(key)) return htmlCache.get(key);
        const root = cdnRoot(project);
        for (const filename of htmlEntryNames) {
          try {
            const res = await fetch(root + filename);
            if (!res.ok) continue;
            const html = await res.text();
            if (!/<(?:!doctype\s+html|html|head|body)\b/i.test(html)) continue;
            const result = { root, html, filename };
            htmlCache.set(key, result);
            return result;
          } catch (error) { console.warn('Could not read entry:', filename, error); }
        }
        throw new Error('No accessible index.html (or other supported HTML entry) in this repository.');
      }

      function htmlForIframe(html, baseUrl) {
        // Relative CSS, scripts, images, and fetches resolve against repo CDN.
        // NOTE: root-absolute paths and service workers need a real hosting origin.
        const baseTag = `<base href="${baseUrl.replace(/&/g, '&amp;').replace(/"/g, '&quot;')}">`;
        if (/<head(?:\s[^>]*)?>/i.test(html)) return html.replace(/<head(?:\s[^>]*)?>/i, m => m + baseTag);
        if (/<html(?:\s[^>]*)?>/i.test(html)) return html.replace(/<html(?:\s[^>]*)?>/i, m => m + '<head>' + baseTag + '</head>');
        return '<!doctype html><head>' + baseTag + '</head>' + html;
      }

      let activeProject = null;
      let activeLaunch = 0;
      async function launchApplicationViewport(project) {
        activeProject = project;
        const launchId = ++activeLaunch;
        document.getElementById('viewportTitle').textContent = project.name + ' — Loading files…';
        const iframe = document.getElementById('appSandboxIframe');
        iframe.removeAttribute('src');
        iframe.srcdoc = '<!doctype html><title>Loading</title><body style="background:#111;color:white;font:16px sans-serif;padding:22px">Loading repository files…</body>';
        document.getElementById('appViewportOverlay').style.display = 'flex';
        document.getElementById('viewNewTabBtn').onclick = () => {
          const win = window.open('about:blank', '_blank');
          if (win && iframe.srcdoc) {
            win.document.open();
            win.document.write(iframe.srcdoc);
            win.document.close();
          }
        };
        document.getElementById('viewAboutBlankBtn').onclick = () => {
          window.open(`https://github.com/${repoPath(project)}`, '_blank', 'noopener');
        };
        try {
          const entry = await loadRepositoryHtml(project);
          if (launchId !== activeLaunch) return;
          iframe.srcdoc = htmlForIframe(entry.html, entry.root);
          document.getElementById('viewportTitle').textContent = project.name + ' — Repository files';
        } catch (error) {
          if (launchId !== activeLaunch) return;
          console.warn('Repository launch failed:', error);
          iframe.srcdoc = `<!doctype html><body style="background:#111;color:#eee;font:16px sans-serif;padding:24px"><h2>Could not launch this game from repository files</h2><p>This repository might need a build, a server, or a different entry filename.</p><p>Check the browser console for details.</p></body>`;
          document.getElementById('viewportTitle').textContent = project.name + ' — Cannot load';
        }
      }

      function closeApplicationViewport() {
        const overlay = document.getElementById('appViewportOverlay');
        const iframe = document.getElementById('appSandboxIframe');
        overlay.style.display = 'none';
        ++activeLaunch;
        iframe.srcdoc = '';
        iframe.src = 'about:blank'; 
        try {
          if(iframe.contentWindow && iframe.contentWindow.document) {
            iframe.contentWindow.document.write('');
            iframe.contentWindow.close();
          }
        } catch(e) { console.log("Memory cleared."); }
      }

      searchBar.addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase();
        const filtered = projectsData.filter(project => {
          return project.name.toLowerCase().includes(searchTerm) || project.description.toLowerCase().includes(searchTerm);
        });
        renderGalleryExecutionBlocks(filtered);
      });

      resolveRawLinkRegistryMap();
    </script>
  </body>
</html>
