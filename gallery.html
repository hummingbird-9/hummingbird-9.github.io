<!DOCTYPE html>
<html>
  <head>
    <title>HTML Gallery</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="https://uploads.onecompiler.io/447kr4gf2/44f9wbztv/humming%5Bbird%5DTech%20logo%20(4).png">
    <style>
      /* 4-COLUMN ROW DYNAMICS: Shrinks the grid parameters down to align exactly 4 items per row */
      .game-card {
        flex-basis: calc(25% - 20px) !important;
        max-width: 240px !important;
        min-width: 180px !important;
        padding: 12px !important;
        box-sizing: border-box !important;
      }
      .game-thumbnail {
        height: 115px !important;
        margin-bottom: 8px !important;
      }
      .game-card h3 {
        font-size: 1.05rem !important;
        margin-bottom: 4px !important;
      }
      .game-card p {
        font-size: 0.85rem !important;
        line-height: 1.3 !important;
      }
    </style>
  </head>
  <body class="gallery-body">

    <div class="top-button-container">
      <a href="index.html" class="open-page-btn back-btn">← Back Home</a>
      <a href="https://github.com/hummingbird-9/hummingbird-9.github.io/issues" target="_blank" class="open-page-btn" style="border-color: rgba(255, 95, 86, 0.4);">Report An Issue</a>
    </div>

    <div class="utility-controls-container">
      <button class="utility-btn" onclick="toggleHardwareProfilerOverlay()">Hardware HUD</button>
      <button id="lightweightToggleBtn" class="utility-btn" onclick="toggleLightweightEngine()">Extreme Lightweight</button>
      <button id="themeToggleBtn" class="utility-btn" onclick="toggleTheme()">Theme Mode</button>
    </div>

    <div class="logo-container gallery-logo-container">
      <img src="https://uploads.onecompiler.io/447kr4gf2/44f9wbztv/humming%5Bbird%5DTech%20logo%20(4).png" alt="Humming[bird]Tech Logo" class="brand-logo">
    </div>

    <p class="content"></p>

    <div class="search-container">
      <input type="text" id="gallerySearch" placeholder="Search applications..." class="search-bar">
      <button class="utility-btn" onclick="clearGalleryFilters()" style="padding: 8px 24px;">Clear</button>
    </div>

    <div class="gallery-container" id="galleryContainer">
      <p id="loadingText">Processing source indexes...</p>
    </div>

    <div id="appViewportOverlay" class="app-viewport-overlay">
      <div class="viewport-navbar">
        <h3 id="viewportTitle" class="viewport-title">Application Sandbox</h3>
        <div class="viewport-controls">
          <button id="viewAboutBlankBtn" class="utility-btn" disabled>about:blank</button>
          <button id="viewNewTabBtn" class="utility-btn" hidden>Open in New Tab</button>
          <button class="utility-btn" style="background:#ff5f56; color:white;" onclick="closeApplicationViewport()">Close</button>
        </div>
      </div>
      <div class="iframe-sandbox-container">
        <iframe id="appSandboxIframe" class="app-iframe" src=""></iframe>
      </div>
    </div>

    <script src="global-utils.js"></script>
    <script>
      const container = document.getElementById('galleryContainer');
      const searchBar = document.getElementById('gallerySearch');
      const newTabButton = document.getElementById('viewNewTabBtn');
      const aboutBlankButton = document.getElementById('viewAboutBlankBtn');
      const appIframe = document.getElementById('appSandboxIframe');
      let projectsData = [];
      let activeProject = null;
      let launchSequence = 0;
      const pagesUrlCache = new Map();

      // This repo has a separately hosted, working public page supplied by the site owner.
      // Every other repository uses its configured GitHub Pages URL.
      const hostedPageOverrides = {
        'one-piece-character-spinner': 'https://ghp.hummingbird.rf.gd/One-Piece-Character-Spinner-/'
      };

      async function resolveRawLinkRegistryMap() {
        try {
          const response = await fetch('html/repos.json');
          if (!response.ok) throw new Error('Could not load html/repos.json.');

          let data;
          try { data = await response.json(); }
          catch (_) { throw new Error('Invalid JSON in html/repos.json.'); }

          if (!data || !Array.isArray(data.repo_links)) {
            throw new Error('repos.json must contain a repo_links array.');
          }

          const parsedRepos = data.repo_links.map(link => {
            const cleanLink = String(link).trim();
            const urlObj = new URL(cleanLink.startsWith('http') ? cleanLink : 'https://' + cleanLink);
            if (urlObj.hostname.toLowerCase() !== 'github.com') {
              throw new Error('Unsupported repository URL: ' + cleanLink);
            }
            const paths = urlObj.pathname.split('/').filter(Boolean);
            if (paths.length < 2) throw new Error('Invalid repository URL: ' + cleanLink);
            return { username: paths[0], repoName: paths[1].replace(/\.git$/i, ''), branch: 'main' };
          });

          let liveMetaMap = {};
          try {
            const apiRes = await fetch('https://api.github.com/users/hummingbird-9/repos?per_page=100');
            if (apiRes.ok) {
              const apiData = await apiRes.json();
              apiData.forEach(repo => { liveMetaMap[repo.name.toLowerCase()] = repo; });
            } else {
              console.warn('GitHub repository metadata unavailable; using fallback descriptions.');
            }
          } catch (apiErr) {
            console.warn('GitHub metadata lookup failed; using fallback descriptions.', apiErr);
          }

          projectsData = parsedRepos.map(info => {
            const parsedTitle = info.repoName.replace(/-/g, ' ');
            const liveRepo = liveMetaMap[info.repoName.toLowerCase()];
            if (liveRepo && liveRepo.default_branch) info.branch = liveRepo.default_branch;

            // Keep the original card names and description behavior. Fix malformed URLs.
            const computedCover = `https://cdn.jsdelivr.net/gh/${info.username}/${info.repoName}@${encodeURIComponent(info.branch)}/cover.png`;
            const dynamicDesc = liveRepo && liveRepo.description
              ? liveRepo.description
              : 'Automated isolated application target interface deployment framework.';
            const pageOverride = hostedPageOverrides[info.repoName.toLowerCase()] || null;

            return {
              username: info.username,
              repoName: info.repoName,
              branch: info.branch,
              name: parsedTitle,
              cover: computedCover,
              backupAvatar: `https://github.com/${encodeURIComponent(info.username)}.png?size=256`,
              description: dynamicDesc,
              hostedPageOverride: pageOverride,
              url: null
            };
          });

          renderGalleryExecutionBlocks(projectsData);
        } catch (error) {
          console.error(error);
          container.textContent = 'Gallery error: ' + error.message;
        }
      }

      function renderGalleryExecutionBlocks(projects) {
        const fragment = document.createDocumentFragment();
        container.innerHTML = '';
        if (!projects.length) {
          container.textContent = 'No items match current filter criteria.';
          return;
        }

        projects.forEach(project => {
          const card = document.createElement('div');
          card.className = 'game-card';
          card.onclick = () => launchApplicationViewport(project);

          const img = document.createElement('img');
          img.className = 'game-thumbnail';
          img.alt = project.name;
          img.loading = 'lazy';
          img.src = project.cover;
          img.onerror = () => {
            img.onerror = null;
            img.src = project.backupAvatar;
          };

          const title = document.createElement('h3');
          title.textContent = project.name;
          const description = document.createElement('p');
          description.textContent = project.description;
          card.append(img, title, description);
          fragment.appendChild(card);
        });
        container.appendChild(fragment);
      }

      function clearGalleryFilters() {
        searchBar.value = '';
        renderGalleryExecutionBlocks(projectsData);
      }

      async function getGitHubPagesUrl(project) {
        if (project.hostedPageOverride) return project.hostedPageOverride;
        const key = `${project.username}/${project.repoName}`.toLowerCase();
        if (pagesUrlCache.has(key)) return pagesUrlCache.get(key);

        const endpoint = `https://api.github.com/repos/${encodeURIComponent(project.username)}/${encodeURIComponent(project.repoName)}/pages`;
        try {
          const response = await fetch(endpoint, {
            headers: { 'Accept': 'application/vnd.github+json' }
          });
          if (!response.ok) {
            pagesUrlCache.set(key, null);
            return null;
          }
          const pages = await response.json();
          // GitHub returns 200 only when a Pages site is configured. Require a
          // successful build state when supplied, and use html_url (custom domains included).
          if (!pages.html_url || (pages.status && pages.status !== 'built')) {
            pagesUrlCache.set(key, null);
            return null;
          }
          const pageUrl = new URL(pages.html_url);
          if (pageUrl.protocol !== 'https:') {
            pagesUrlCache.set(key, null);
            return null;
          }
          const result = pageUrl.href.endsWith('/') ? pageUrl.href : pageUrl.href + '/';
          pagesUrlCache.set(key, result);
          return result;
        } catch (error) {
          console.warn('Could not check GitHub Pages for ' + project.repoName, error);
          pagesUrlCache.set(key, null);
          return null;
        }
      }

      function setTabActions(url, title) {
        newTabButton.hidden = false;
        newTabButton.disabled = false;
        newTabButton.onclick = () => {
          // Called directly from the user's button click to avoid popup blocking.
          window.open(url, '_blank', 'noopener');
        };

        aboutBlankButton.disabled = false;
        aboutBlankButton.onclick = () => {
          const blankWindow = window.open('about:blank', '_blank');
          if (!blankWindow) return;
          const safeTitle = String(title || 'Application').replace(/[&<>"']/g, '');
          const safeUrl = String(url).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
          blankWindow.document.open();
          blankWindow.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${safeTitle}</title></head><body style="margin:0;padding:0;overflow:hidden"><iframe src="${safeUrl}" title="${safeTitle}" style="width:100vw;height:100vh;border:0;display:block"></iframe></body></html>`);
          blankWindow.document.close();
        };
      }

      async function launchApplicationViewport(project) {
        activeProject = project;
        const thisLaunch = ++launchSequence;
        document.getElementById('viewportTitle').innerText = project.name + ' — Checking GitHub Pages…';
        document.getElementById('appViewportOverlay').style.display = 'flex';
        newTabButton.hidden = true;
        newTabButton.disabled = true;
        newTabButton.onclick = null;
        aboutBlankButton.disabled = true;
        aboutBlankButton.onclick = null;
        appIframe.removeAttribute('src');
        appIframe.srcdoc = '<!doctype html><html><body style="background:#111;color:#eee;font:16px Arial;padding:24px">Checking this repository\'s GitHub Pages site…</body></html>';

        const url = await getGitHubPagesUrl(project);
        if (thisLaunch !== launchSequence || activeProject !== project) return;
        if (!url) {
          document.getElementById('viewportTitle').innerText = project.name + ' — GitHub Pages unavailable';
          appIframe.srcdoc = '<!doctype html><html><body style="background:#111;color:#eee;font:16px Arial;padding:24px"><h2>GitHub Pages is not available for this repository.</h2><p>This game is opened from its GitHub Pages site, not from raw repository files. The Open in New Tab button is hidden because GitHub did not confirm an active Pages site or successful build.</p><p>Check the repository Settings → Pages and its latest Pages deployment.</p></body></html>';
          return;
        }

        project.url = url;
        appIframe.srcdoc = '';
        appIframe.src = url;
        document.getElementById('viewportTitle').innerText = project.name;
        setTabActions(url, project.name);
      }

      function closeApplicationViewport() {
        const overlay = document.getElementById('appViewportOverlay');
        overlay.style.display = 'none';
        ++launchSequence;
        activeProject = null;
        appIframe.srcdoc = '';
        appIframe.src = 'about:blank';
        newTabButton.hidden = true;
        newTabButton.disabled = true;
        newTabButton.onclick = null;
        aboutBlankButton.disabled = true;
        aboutBlankButton.onclick = null;
      }

      searchBar.addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase();
        const filtered = projectsData.filter(project =>
          project.name.toLowerCase().includes(searchTerm) ||
          project.description.toLowerCase().includes(searchTerm)
        );
        renderGalleryExecutionBlocks(filtered);
      });

      resolveRawLinkRegistryMap();
    </script>
  </body>
</html>
