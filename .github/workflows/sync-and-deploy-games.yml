name: Sync games into the GitHub Pages branch

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "games.html"
      - "web.html"
      - "404.html"
      - ".github/workflows/sync-and-deploy-games.yml"

permissions:
  contents: write

concurrency:
  group: sync-games-to-pages-branch
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the website branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Check out the games repository
        uses: actions/checkout@v4
        with:
          repository: hummingbird-9/games
          ref: main
          path: games-source
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/scripts/
            !/repair-reports/
            !/third-party-licenses/
            !/.github/
            !/*/_ext/
            !/*/_ext/**
          sparse-checkout-cone-mode: false

      - name: Check out HummingEngine source
        uses: actions/checkout@v4
        with:
          repository: hummingbird-9/HummingEngine
          ref: main
          path: hummingengine-source
          fetch-depth: 1

      - name: Set up Node.js for HummingEngine
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare game folders for branch-based Pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          root = Path.cwd()
          source = root / "games-source"
          stage = root / "games-stage"
          target = root / "games"

          if stage.exists():
              shutil.rmtree(stage)
          stage.mkdir()

          folders = sorted(
              folder for folder in source.iterdir()
              if folder.is_dir() and (folder / "index.html").is_file()
          )
          if not folders:
              raise SystemExit("No game folders with index.html were found.")

          def ignore_assets(directory, names):
              return [name for name in names if name in {"_ext", ".git", "node_modules"}]

          file_count = 0
          total_bytes = 0
          for folder in folders:
              destination = stage / folder.name
              shutil.copytree(folder, destination, ignore=ignore_assets)
              for file in destination.rglob("*"):
                  if file.is_file():
                      file_count += 1
                      total_bytes += file.stat().st_size

          mib = total_bytes / (1024 * 1024)
          print(f"Prepared {len(folders)} games, {file_count} files, {mib:.1f} MiB.")
          if total_bytes > 900 * 1024 * 1024:
              raise SystemExit("Game mirror exceeds the 900 MiB GitHub Pages safety threshold.")

          if target.exists():
              shutil.rmtree(target)
          stage.rename(target)
          (root / ".nojekyll").write_text("", encoding="utf-8")
          print("Installed game folders in ./games for branch-based Pages publishing.")
          PY

      - name: Build HummingEngine for same-origin GitHub Pages hosting
        working-directory: hummingengine-source
        env:
          PAGES_BASE_PATH: /HummingEngine/
        run: npm run build:pages

      - name: Install HummingEngine under the main HTTPS site origin
        shell: bash
        run: |
          set -euo pipefail
          rm -rf HummingEngine
          mkdir -p HummingEngine
          cp -a hummingengine-source/_site/. HummingEngine/
          test -s HummingEngine/index.html
          test -s HummingEngine/sw-v2.js
          test -s HummingEngine/v2-scram/scramjet.js
          test -s HummingEngine/v2-controller/controller.api.js
          test -s HummingEngine/v2-epoxy/index.mjs
          grep -q '<meta name="app-base" content="/HummingEngine/">' HummingEngine/index.html
          echo "Staged HummingEngine at /HummingEngine/ with its Pages subpath and Scramjet 2 assets."

      - name: Commit and push the game mirror
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- games HummingEngine .nojekyll
          if git diff --cached --quiet; then
            echo "The published game mirror is already up to date."
            exit 0
          fi
          git commit -m "Sync playable game files for GitHub Pages"
          git push origin HEAD:main

      - name: Verify the branch contains Precise Bowling
        shell: bash
        run: |
          test -s "games/3D Bowling/index.html"
          test -s "games/3D Bowling/BowlingOnline2.js"
          test -s "games/3D Bowling/BowlingOnline2.data"
          test -s "games/3D Bowling/BowlingOnline2.wasm"
          echo "Precise Bowling HTML, JavaScript, data, and WASM are committed to the Pages branch."
