name: Vendor matching Stockfish 19 worker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vendor-stockfish-worker.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vendor-stockfish-19-worker
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Download and verify official Stockfish.js 19.0.1 worker
        shell: bash
        run: |
          set -euo pipefail
          target="engine/stockfish/stockfish-19-lite-single.js"
          expected="ccb130d7ff29408531c47d859a49f91d59d4f482d05a53eb1a3231a4f624c91a"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          urls=(
            "https://github.com/nmrugg/stockfish.js/releases/download/v19.0.1/stockfish-19-lite-single.js"
            "https://unpkg.com/stockfish@19.0.1/bin/stockfish-19-lite-single.js"
          )
          verified=""
          for url in "${urls[@]}"; do
            echo "Trying $url"
            if curl -fLsS --retry 2 --retry-all-errors --connect-timeout 15 --max-time 90 "$url" -o "$tmp"; then
              actual="$(sha256sum "$tmp" | awk '{print $1}')"
              if [[ "$actual" == "$expected" ]]; then
                verified="$url"
                break
              fi
              echo "Checksum mismatch for $url: $actual"
            fi
          done
          if [[ -z "$verified" ]]; then
            echo "::error::Could not fetch the exact Stockfish.js 19.0.1 lite single-threaded worker."
            exit 1
          fi
          mkdir -p "$(dirname "$target")"
          install -m 0644 "$tmp" "$target"
          echo "Verified official worker from $verified"
          echo "SHA-256: $expected"
          echo "Size: $(wc -c < "$target") bytes"

      - name: Commit matching Stockfish worker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/stockfish/stockfish-19-lite-single.js
          if git diff --cached --quiet; then
            echo "Official Stockfish worker is already present."
            exit 0
          fi
          git commit -m "Use official matching Stockfish 19 worker"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Could not push the official Stockfish worker."
          exit 1
