name: Verify published game routes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-pages-game-routes.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify the public Precise Bowling page and required files
        shell: bash
        run: |
          set -euo pipefail
          base="https://ghp.hummingbird.rf.gd"
          page="$base/games/3D%20Bowling/index.html"

          for attempt in $(seq 1 12); do
            echo "Attempt $attempt: $page"
            meta="$(curl --silent --show-error --location --max-time 20 \
              --output /tmp/bowling-index.html \
              --write-out '%{http_code}|%{content_type}|%{url_effective}' "$page" || true)"
            status="${meta%%|*}"
            rest="${meta#*|}"
            content_type="${rest%%|*}"
            echo "HTML response: ${status:-no status} | ${content_type:-no content type} | $meta"

            if [[ "$status" == "200" && "$content_type" == text/html* ]] &&
               grep -qi '<canvas id="canvas"' /tmp/bowling-index.html; then
              echo "Precise Bowling HTML is served as an executable HTML document."
              break
            fi

            if [[ "$attempt" == "12" ]]; then
              echo "Precise Bowling HTML did not become available after the retries."
              head -c 600 /tmp/bowling-index.html || true
              exit 1
            fi
            sleep 10
          done

          for asset in BowlingOnline2.js BowlingOnline2.data BowlingOnline2.wasm; do
            url="$base/games/3D%20Bowling/$asset"
            status="$(curl --silent --show-error --location --max-time 30 \
              --output /dev/null --write-out '%{http_code}' "$url")"
            echo "$asset -> HTTP $status"
            test "$status" = "200"
          done

          echo "All tested game document and runtime asset routes returned successfully."
