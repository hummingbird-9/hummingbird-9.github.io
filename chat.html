<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chat — humming[bird]Tech</title>
  <link rel="stylesheet" href="style.css?v=20261115-shared-topbar-restore-15">
  <link rel="shortcut icon" href="https://uploads.onecompiler.io/447kr4gf2/44f9wbztv/humming%5Bbird%5DTech%20logo%20(4).png">
  <style>
    /* Let Padlet use the full available screen beneath the shared navigation. */
    body.chat-page {
      display:flex;
      flex-direction:column;
      align-items:stretch;
      justify-content:flex-start;
      width:100%;
      height:100vh;
      height:100dvh;
      min-height:0;
      padding:8px 12px 10px;
      overflow:hidden;
      text-align:left;
    }
    .chat-page-main {
      display:flex;
      flex:1 1 auto;
      flex-direction:column;
      min-height:0;
      width:100%;
      max-width:none;
      margin:0;
      gap:3px;
    }
    .chat-page-main h1 {
      flex:0 0 auto;
      margin:0;
      font-size:1.15rem;
      line-height:1.25;
    }
    .chat-page-main > .content {
      flex:0 0 auto;
      margin:0 0 5px;
    }
    .chat-frame {
      display:block;
      flex:0 1 auto;
      align-self:center;
      width:min(100%, calc((100dvh - 155px) * (1100 / 760)));
      max-height:calc(100dvh - 155px);
      height:auto;
      aspect-ratio:1100 / 760;
      margin:0;
    }
    @media(max-width:760px) {
      body.chat-page { padding:6px 8px 8px; }
      .chat-page-main h1 { font-size:1rem; }
      .chat-page-main > .content { margin-bottom:3px; font-size:.82rem; }
    }
  </style>
</head>
<body class="gallery-body chat-page">
  <main class="chat-page-main">
    <h1>Chat</h1>
    <p class="content">Community discussion and messages.</p>
    <iframe class="comments-frame chat-frame" src="https://padlet.com/hummingbird9/hummingtech" title="HummingbirdTech chat" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="clipboard-write"></iframe>
  </main>
  <script src="global-utils.js?v=20261115-glass-opacity-default-zero-12"></script>
</body>
</html>
