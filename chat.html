<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chat — humming[bird]Tech</title>
  <link rel="stylesheet" href="style.css?v=20261128-settings-classroom-beta-4">
  <link rel="shortcut icon" href="img/humming.png">
  <style>
    /* Let Padlet use the full available screen beneath the shared navigation. */
    body.chat-page {
      display:flex;
      flex-direction:column;
      align-items:stretch;
      justify-content:flex-start;
      width:100%;
      height:auto;
      min-height:100vh;
      min-height:100dvh;
      padding:16px 12px 12px;
      overflow-x:hidden;
      overflow-y:auto;
      text-align:left;
    }
    .chat-page-main {
      display:flex;
      flex:0 0 auto;
      flex-direction:column;
      align-self:center;
      min-height:0;
      width:min(100%, 1700px, calc((100dvh - 125px) * (16 / 9)));
      max-width:none;
      margin:0;
      gap:3px;
    }
    .chat-page-main h1 {
      flex:0 0 auto;
      margin:0;
      font-size:1.15rem;
      line-height:1.25;
      text-align:left;
    }
    .chat-page-main > .content {
      flex:0 0 auto;
      align-self:stretch;
      width:100%;
      max-width:none;
      margin:0 0 5px;
      text-align:left;
    }
    .chat-frame {
      display:block;
      flex:0 0 auto;
      align-self:stretch;
      width:100%;
      max-height:calc(100dvh - 125px);
      height:auto;
      aspect-ratio:16 / 9;
      margin:0;
    }
    @media(max-width:760px) {
      body.chat-page { padding:12px 8px 8px; }
      .chat-page-main h1 { font-size:1rem; }
      .chat-page-main > .content { margin-bottom:3px; font-size:.82rem; }
    }
  </style>
</head>
<body class="gallery-body chat-page">
  <main class="chat-page-main">
    <h1>Chat</h1>
    <p class="content">Community discussion and messages.</p>
    <iframe class="comments-frame chat-frame" src="https://padlet.com/hummingbird9/hummingtech" title="HummingbirdTech chat" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="clipboard-write"></iframe>
  </main>
  <script src="global-utils.js?v=20261128-settings-classroom-beta-2"></script>
</body>
</html>
