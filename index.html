<!DOCTYPE html>
<html>
  <head>
    <title>HummingStudios</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="https://uploads.onecompiler.io/447kr4gf2/44f9wbztv/humming%5Bbird%5DTech%20logo%20(4).png">
  </head>
  <body>

    <div class="top-button-container">
      <a href="about.html" class="open-page-btn">About HummingStudios</a>
      <a href="https://github.com/hummingbird-9/hummingbird-9.github.io/issues/" target="_blank" class="open-page-btn" style="border-color: rgba(255, 95, 86, 0.4);">Report An Issue</a>
    </div>
    <div class="utility-controls-container">
      <button class="utility-btn" onclick="toggleHardwareProfilerOverlay()">Hardware HUD</button>
      <button id="lightweightToggleBtn" class="utility-btn" onclick="toggleLightweightEngine()">Extreme Lightweight</button>
      <button id="themeToggleBtn" class="utility-btn" onclick="toggleTheme()">Theme Mode</button>
    </div>
    <div class="logo-container">
      <img src="https://uploads.onecompiler.io/447kr4gf2/44f9wbztv/humming%5Bbird%5DTech%20logo%20(4).png" alt="Humming[bird]Tech Logo" class="brand-logo">
    </div>

    <p class="content">Making non-web applications and softwares run as an HTML since 2025</p>

    <div class="button-container">
      <a href="gallery.html" class="open-page-btn">See HTML Gallery</a>
      <a href="web.html" class="open-page-btn" id="hummingWebButton">Search the HummingWeb</a>
    </div>

    <script src="global-utils.js"></script>
    <script>
      document.getElementById('hummingWebButton').addEventListener('click',function(event){
        const tab=window.open('about:blank','_blank');
        if(!tab)return;
        event.preventDefault();
        const html='<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HummingProxy</title><style>html,body{height:100%;margin:0;background:#10291a;overflow:hidden}iframe{height:100%;width:100%;border:0;display:block}</style></head><body><iframe src="https://hummingproxy-saj5.onrender.com/" title="HummingProxy" allow="fullscreen; clipboard-read; clipboard-write" allowfullscreen></iframe></body></html>';
        try{tab.document.open();tab.document.write(html);tab.document.close();}catch(error){tab.location.href='https://hummingproxy-saj5.onrender.com/';}
      });
    </script>
  </body>
</html>
