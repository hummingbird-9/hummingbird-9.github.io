<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>humming[bird]Tech</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(135deg, #0a2e0a, #1a5d1a, #0a2e0a, #1a5d1a);
      background-size: 400% 400%;
      animation: gradientBG 20s ease infinite;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      text-align: center;
      justify-content: flex-start;
      padding-top: 40px;
      position: relative;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    button {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #e0f7e0;
      cursor: pointer;
      font-size: 18px;
      font-weight: 600;
      margin: 10px 0; 
      padding: 14px 40px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 8px 32px 0 rgba(0, 255, 45, 0.15);
      backdrop-filter: saturate(180%) blur(10px);
      -webkit-backdrop-filter: saturate(180%) blur(10px);
      transition: transform 0.3s ease, background 0.3s ease;
      min-width: 180px;
      user-select: none;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.05);
      outline: none;
    }

    #warning-text {
      font-size: 1.1rem;
      color: #ff4d4d;
      opacity: 0; 
      transition: opacity 0.3s ease;
      max-width: 600px;
      position: absolute; 
      pointer-events: none;
      transform: translateY(65px); 
    }

    #gallery-btn:hover ~ #warning-text {
      opacity: 1;
    }
  </style>
</head>

<body>

<h1>
  <!-- URL tracking parameter to stop logo bypass tricks -->
  <a href="index.html?bypass=true">
    <img src="https://uploads.onecompiler.io/447kr4gf2/44f9wbztv/humming%5Bbird%5DTech%20logo%20(4).png" alt="Logo" style="cursor: pointer; border: none;">
  </a>
</h1>

  <button id="gallery-btn" onclick="location.href='gallery.html'">Gallery of ports, flash games, and other HTMLs</button>
  
  <h3 id="warning-text">ONLY FOR USE OUTSIDE OF CLASS</h3>

  <button onclick="location.href='hummingweb.html'">Search Engine</button>
  <button onclick="alert('Made by Oliver Boyd (hummingbird_9). humming[bird]Tech Version 1.8.4')">About</button>
  <button onclick="location.href='kodub.html'">kodub's stuff (poly track and such)</button>
  <button onclick="location.href='test.html'">Current Beta Test HTML Thingy</button>
  <button onclick="location.href='elmofight.html'">Elmo Fight</button>
  <button onclick="location.href='freeeducation.html'">Freeeducation portal (in case this doesn't satisfy you)</button>

  <script>
    function checkClassStatus() {
      const now = new Date();
      const day = now.getDay(); // 0 = Sunday, 1 = Monday, ..., 6 = Saturday
      const hours = now.getHours();
      const minutes = now.getMinutes();
      
      // Convert current time to total minutes past midnight
      const totalMinutes = (hours * 60) + minutes;
      
      // Define your school day schedule parameters (Example: Mon-Fri, 8:00 AM to 3:30 PM)
      const isWeekday = (day >= 1 && day <= 5);
      const startMinutes = (8 * 60) + 0;   // 08:00 AM
      const endMinutes = (15 * 60) + 30;  // 03:30 PM
      
      const isSchoolHours = isWeekday && (totalMinutes >= startMinutes && totalMinutes <= endMinutes);
      
      // Catch sneaky logo link clicks using the URL search parameter
      const urlParams = new URLSearchParams(window.location.search);
      const triedToBypass = urlParams.get('bypass');

      if (isSchoolHours || triedToBypass === 'true') {
        // Hide elements during school time or if bypass trick is detected
        document.getElementById('gallery-btn').style.display = 'none';
        document.getElementById('warning-text').style.opacity = '0';
        document.getElementById('warning-text').style.visibility = 'hidden';
        console.log("Class Time Block Active: Gallery Hidden.");
        
        // Clear out the cheat parameter quietly so they can't bookmark it to break things
        if (triedToBypass === 'true') {
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      } else {
        // Safely show buttons outside of school hours
        document.getElementById('gallery-btn').style.display = 'inline-block';
        document.getElementById('warning-text').style.visibility = 'visible'; 
      }
    }

    // Run calculations immediately
    checkClassStatus();

    // Re-verify the current time parameters every 10 seconds
    setInterval(checkClassStatus, 10000);

    // EMERGENCY MANUAL HIDE: Escape button safety override
    document.addEventListener('keydown', (e) => {
      if (e.key === "Escape") {
        document.getElementById('gallery-btn').style.display = 'none';
        document.getElementById('warning-text').style.display = 'none';
      }
    });
  </script>
</body>
</html>
