<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humming[bird]Tech</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="https://onecompiler.io">
  </head>
  <body>
    
    <div class="top-button-container">
      <a href="about.html" class="open-page-btn">About</a>
      <a href="https://github.com/hummingbird-9/hummingbird-9.github.io/issues" target="_blank" rel="noopener noreferrer" class="open-page-btn" style="border-color: rgba(255, 95, 86, 0.4);">Report An Issue</a>

    <div class="utility-controls-container">
      <button class="utility-btn" onclick="toggleHardwareProfilerOverlay()">Hardware HUD</button>

      <button id="themeToggleBtn" class="utility-btn" onclick="toggleTheme()">Theme Mode</button>
    </div>

    <div class="logo-container">
      <img src="https://onecompiler.io" alt="Humming[bird]Tech Logo" class="brand-logo">
    </div>
    
    <p class="content">Making non-web applications and softwares run as an HTML since 2025</p>
    
    <div class="button-container">
      <a href="gallery.html" class="open-page-btn">See HTML Gallery</a>
    </div>
    
    <script src="global-utils.js"></script>
