<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a2e0a">
  <title>humming[bird]Tech</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="https://uploads.onecompiler.io/447kr4gf2/44f9wbztv/humming%5Bbird%5DTech%20logo%20(4).png">
  <style>
    body.home-page { justify-content:flex-start; padding:64px 20px 48px; }
    .home-shell { width:min(920px,100%); margin:auto; display:flex; flex-direction:column; align-items:center; gap:22px; }
    .home-brand { width:min(540px,82vw); margin:16px auto 0; }
    .home-brand img { width:100%; height:auto; object-fit:contain; }
    .home-intro { max-width:620px; margin:0; color:var(--hb-muted); font-size:1.08rem; }
    .home-gallery-buttons { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; width:min(720px,100%); }
    .home-gallery-buttons button, .home-secondary { min-width:0 !important; width:100%; min-height:58px; margin:0 !important; padding:16px 22px !important; font-size:1rem !important; font-weight:650 !important; }
    .home-secondary { width:min(350px,100%); }
    #warning-text { margin:0; color:#ff7474; font-size:.9rem; opacity:0; transition:opacity .2s; }
    .home-gallery-buttons:hover ~ #warning-text { opacity:1; }
    @media(max-width:600px) { .home-gallery-buttons { grid-template-columns:1fr; } body.home-page { padding-top:76px; } }
  </style>
</head>
<body class="home-page">
  <main class="home-shell">
    <a class="home-brand" href="index.html" aria-label="humming[bird]Tech home">
      <img src="https://uploads.onecompiler.io/447kr4gf2/44f9wbztv/humming%5Bbird%5DTech%20logo%20(4).png" alt="Humming[bird]Tech">
    </a>
    <p class="home-intro">A collection of web ports, projects, and tools.</p>
    <nav class="home-gallery-buttons" aria-label="Explore">
      <button id="gallery-btn" type="button" onclick="location.href='gallery.html'">View Web Ports and Projects</button>
      <button id="games-btn" type="button" onclick="location.href='games.html'">View HTML Games</button>
    </nav>
    <p id="warning-text">ONLY FOR USE OUTSIDE OF CLASS</p>
    <button class="utility-btn home-secondary" type="button" onclick="location.href='web.html'">Search Hummingweb</button>
  </main>
  <script src="global-utils.js"></script>
  <script>
    function checkClassStatus() {
      fetch('https://onecompiler.com', { mode: 'no-cors' })
        .then(() => {
          document.getElementById('gallery-btn').style.display = 'block';
          document.getElementById('games-btn').style.display = 'block';
          document.getElementById('warning-text').style.visibility = 'visible';
        })
        .catch(() => {
          document.getElementById('gallery-btn').style.display = 'none';
          document.getElementById('games-btn').style.display = 'none';
          document.getElementById('warning-text').style.opacity = '0';
          document.getElementById('warning-text').style.visibility = 'hidden';
        });
    }
    checkClassStatus();
    setInterval(checkClassStatus, 10000);
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        document.getElementById('gallery-btn').style.display = 'none';
        document.getElementById('games-btn').style.display = 'none';
        document.getElementById('warning-text').style.display = 'none';
      }
    });
  </script>
</body>
</html>
