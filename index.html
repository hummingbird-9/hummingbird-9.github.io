<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>humming[bird]Tech</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(135deg, #0a2e0a, #1a5d1a, #0a2e0a, #1a5d1a);
      background-size: 400% 400%;
      animation: gradientBG 20s ease infinite;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      text-align: center;
      justify-content: flex-start;
      padding-top: 40px;
      position: relative;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    button {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #e0f7e0;
      cursor: pointer;
      font-size: 18px;
      font-weight: 600;
      margin: 10px 0; 
      padding: 14px 40px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 8px 32px 0 rgba(0, 255, 45, 0.15);
      backdrop-filter: saturate(180%) blur(10px);
      -webkit-backdrop-filter: saturate(180%) blur(10px);
      transition: transform 0.3s ease, background 0.3s ease;
      min-width: 180px;
      user-select: none;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.05);
      outline: none;
    }

    #warning-text {
      font-size: 1.1rem;
      color: #ff4d4d;
      opacity: 0; 
      transition: opacity 0.3s ease;
      max-width: 600px;
      position: absolute; 
      pointer-events: none;
      transform: translateY(65px); 
    }

    #gallery-btn:hover ~ #warning-text {
      opacity: 1;
    }
  </style>
</head>

<body>

<h1>
  <!-- Clean version of your original logo link layout -->
  <a href="index.html?bypass=true">
    <img src="https://uploads.onecompiler.io/447kr4gf2/44f9wbztv/humming%5Bbird%5DTech%20logo%20(4).png" alt="Logo" style="cursor: pointer; border: none;">
  </a>
</h1>

  <!-- Navigation items protected by the active class warning check -->
  <button id="gallery-btn" onclick="tryAccessGame('gallery.html')">Gallery of ports, flash games, and other HTMLs</button>
  
  <h3 id="warning-text">ONLY FOR USE OUTSIDE OF CLASS</h3>

  <button onclick="location.href='hummingweb.html'">Search Engine</button>
  <button onclick="alert('Made by Oliver Boyd (hummingbird_9). humming[bird]Tech Version 2.0.5')">About</button>
  <button onclick="tryAccessGame('kodub.html')">kodub's stuff (poly track and such)</button>
  <button onclick="tryAccessGame('test.html')">Current Beta Test HTML Thingy</button>
  <button onclick="tryAccessGame('elmofight.html')">Elmo Fight</button>
  <button onclick="location.href='freeeducation.html'">Freeeducation portal (in case this doesn't satisfy you)</button>

  <script>
    let isClassActive = false;

    function checkClassStatus() {
      // 1. Instant check for manual logo parameter bypass url
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('bypass') === 'true') {
        isClassActive = false;
        return; 
      }

      // 2. Hardware Environment Check (Instantly disables engine blocks on Apple/Mac computers)
      const userAgent = navigator.userAgent.toUpperCase();
      const platform = navigator.platform.toUpperCase();
      if (platform.indexOf('MAC') !== -1 || userAgent.indexOf('MAC') !== -1) {
        isClassActive = false;
        return;
      }

      // 3. True Linewize Network Sniffer Probe
      // Performs a rapid network verification handshake request to look for active tracking proxies
      fetch('https://linewize.net', { mode: 'no-cors', cache: 'no-store' })
        .then(() => {
          // If the network resolves directly to a Linewize login gateway page, a class filter is active
          isClassActive = true;
        })
        .catch(() => {
          // If it fails or times out (like on your personal home network or a Mac), class is NOT active
          isClassActive = false;
        });
    }

    // Intercept function handling restricted game navigation buttons
    function tryAccessGame(destinationUrl) {
      if (isClassActive) {
        alert("NO GAMES IN CLASS (THAT MEANS YOU JASPER)");
      } else {
        window.location.href = destinationUrl;
      }
    }

    // Initialize detection loops immediately on runtime load
    checkClassStatus();
    setInterval(checkClassStatus, 4000);
  </script>
</body>
</html>
