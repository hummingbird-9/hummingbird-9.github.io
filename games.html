<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>humming[bird]Tech — Games</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="https://uploads.onecompiler.io/447kr4gf2/44f9wbztv/humming%5Bbird%5DTech%20logo%20(4).png">
  <style>
    /* Keep the same glass search styling and card language used by gallery.html. */
    .games-toolbar {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      width:min(1100px, calc(100% - 20px));
      margin:10px auto 0;
    }
    .games-search-container {
      flex:1 1 520px;
      width:100%;
      max-width:700px;
      min-width:180px;
      margin:0;
      gap:0;
    }
    .games-search-container .search-bar { width:100%; }
    #refreshGames, #htmlSelector {
      flex:0 0 auto;
      min-width:0 !important;
      width:auto;
      max-width:230px;
      margin:0 !important;
      padding:11px 16px !important;
      border-radius:12px !important;
      font-size:14px !important;
    }
    #htmlSelector { color:white; }
    #htmlSelector:disabled { opacity:.65; cursor:not-allowed; }
    #htmlSelector option { color:#10251b; background:#eafff3; }
    #gamesStatus {
      width:min(1100px, calc(100% - 24px));
      min-height:24px;
      margin:12px auto 0;
      color:rgba(255,255,255,.85);
      text-align:center;
      font-size:.95rem;
    }
    #gamesTotal { margin-left:8px; opacity:.72; font-size:.85em; }
    #container { margin-top:22px; }
    #container .game-card {
      flex:1 1 calc(25% - 20px);
      flex-basis:calc(25% - 20px);
      max-width:240px;
      min-width:180px;
      padding:12px;
      box-sizing:border-box;
    }
    #container .game-thumbnail {
      height:115px;
      margin-bottom:8px;
    }
    #container .game-card h3 {
      margin:0 0 4px;
      font-size:1.05rem;
      overflow-wrap:anywhere;
    }
    #container .game-card p {
      font-size:.85rem;
      line-height:1.3;
    }
    .game-folder-name {
      display:block;
      margin-top:7px;
      color:rgba(255,255,255,.63);
      font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size:11px;
      overflow-wrap:anywhere;
    }
    #gamesEmpty { width:100%; text-align:center; opacity:.8; }

    /* Game player overlay mirrors the gallery's centered application viewport. */
    #gameViewer {
      display:none;
      position:fixed;
      inset:0;
      z-index:20000;
      flex-direction:column;
      background:rgba(0,0,0,.92);
    }
    #gameViewer.is-open { display:flex; }
    .game-viewer-navbar {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:10px 16px;
      background:#111;
      border-bottom:1px solid #292929;
      text-align:left;
    }
    #gameViewerTitle { margin:0; color:#fff; font-size:17px; font-weight:600; }
    .game-viewer-controls { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
    .game-viewer-controls button {
      min-width:0 !important;
      margin:0 !important;
      padding:8px 13px !important;
      font-size:13px !important;
      border-radius:10px !important;
    }
    #closeGame { background:rgba(255,95,86,.75) !important; color:white !important; }
    .game-frame-wrap { flex:1; min-height:0; background:#000; }
    #gameFrame { display:block; width:100%; height:100%; border:0; background:#fff; }
    @media (max-width:720px) {
      .games-toolbar { flex-wrap:wrap; }
      .games-search-container { order:3; flex:1 1 100%; max-width:none; }
      #refreshGames { order:2; }
      #htmlSelector { order:4; max-width:100%; flex:1 1 100%; }
      #container .game-card { flex-basis:calc(50% - 20px); min-width:145px; }
      .game-viewer-navbar { align-items:flex-start; flex-direction:column; }
      .game-viewer-controls { width:100%; justify-content:flex-start; }
    }
    @media (max-width:420px) {
      #container .game-card { flex-basis:100%; max-width:none; }
    }
  </style>
</head>
<body class="gallery-body">
  <div class="top-button-container">
    <a href="index.html" class="open-page-btn back-btn">← Home</a>
  </div>

  <div class="logo-container gallery-logo-container">
    <img src="https://uploads.onecompiler.io/447kr4gf2/44f9wbztv/humming%5Bbird%5DTech%20logo%20(4).png" alt="Humming[bird]Tech Logo" class="brand-logo">
  </div>

  <p class="content">Browse and play games</p>

  <div class="games-toolbar" role="search">
    <button id="refreshGames" class="utility-btn" type="button" title="Refresh the games from GitHub">↻ Refresh</button>
    <div class="search-container games-search-container">
      <input type="search" id="searchBar" class="search-bar" placeholder="Search games..." autocomplete="off" spellcheck="false" aria-label="Search games">
    </div>
    <select id="htmlSelector" class="utility-btn" aria-label="Choose which HTML file to play" disabled>
      <option value="">HTML file — open a game first</option>
    </select>
  </div>

  <div id="gamesStatus" role="status" aria-live="polite">Loading games from GitHub...</div>
  <div id="gamesTotal"></div>
  <div id="container" class="gallery-container"></div>

  <div id="gameViewer" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Game player">
    <div class="game-viewer-navbar">
      <h2 id="gameViewerTitle">Game</h2>
      <div class="game-viewer-controls">
        <button id="aboutBlankGame" class="utility-btn" type="button">about:blank</button>
        <button id="newTabGame" class="utility-btn" type="button">New Tab</button>
        <button id="closeGame" class="utility-btn" type="button">Close</button>
      </div>
    </div>
    <div class="game-frame-wrap" id="gameFrameWrap"></div>
  </div>

  <script>
  (() => {
    'use strict';

    const OWNER = 'hummingbird-9';
    const REPO = 'games';
    const BRANCH = 'main';
    const TREE_API = `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;
    const CDN_ROOT = `https://cdn.jsdelivr.net/gh/${OWNER}/${REPO}@${BRANCH}/`;
    const CACHE_KEY = 'hummingbird-games-folder-catalog-v1';
    const CACHE_TTL = 60 * 60 * 1000;

    const container = document.getElementById('container');
    const searchBar = document.getElementById('searchBar');
    const statusEl = document.getElementById('gamesStatus');
    const totalEl = document.getElementById('gamesTotal');
    const htmlSelector = document.getElementById('htmlSelector');
    const viewer = document.getElementById('gameViewer');
    const viewerTitle = document.getElementById('gameViewerTitle');
    const frameWrap = document.getElementById('gameFrameWrap');

    let games = [];
    let visibleGames = [];
    let activeGame = null;
    let activeHtml = 'index.html';
    let isLoading = false;

    function encodePath(path) {
      return String(path).split('/').map(part => encodeURIComponent(part)).join('/');
    }

    function gameUrl(game, htmlFile) {
      return CDN_ROOT + encodePath(game.folder + '/' + (htmlFile || 'index.html'));
    }

    function folderUrl(game) {
      return CDN_ROOT + encodePath(game.folder) + '/';
    }

    function humanizeFolder(folder) {
      return folder
        .replace(/[-_]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .replace(/\b([a-z])/g, letter => letter.toUpperCase());
    }

    function chooseCover(folder, pngPaths) {
      if (!pngPaths.length) return '';
      const direct = pngPaths.filter(path => !path.slice(folder.length + 1).includes('/'));
      const candidates = direct.length ? direct : pngPaths;
      const score = path => {
        const file = path.split('/').pop().toLowerCase();
        if (file === 'cover.png') return 0;
        if (file === 'thumbnail.png' || file === 'thumb.png') return 1;
        if (file === 'icon.png' || file === 'logo.png') return 2;
        if (file === folder.toLowerCase() + '.png') return 3;
        return 10;
      };
      return candidates.slice().sort((a, b) => score(a) - score(b) || a.localeCompare(b))[0];
    }

    function makeCatalog(treeEntries) {
      const byFolder = new Map();
      for (const entry of treeEntries) {
        if (!entry || entry.type !== 'blob' || typeof entry.path !== 'string') continue;
        const match = entry.path.match(/^([^/]+)\/(.+)$/);
        if (!match) continue;
        const folder = match[1];
        const relativePath = match[2];
        if (folder.startsWith('.')) continue;
        if (!byFolder.has(folder)) byFolder.set(folder, { htmlFiles: [], pngPaths: [] });
        const record = byFolder.get(folder);
        if (/\.html?$/i.test(relativePath) && !relativePath.includes('/')) {
          record.htmlFiles.push(relativePath);
        }
        if (/\.png$/i.test(relativePath)) record.pngPaths.push(entry.path);
      }

      const result = [];
      for (const [folder, record] of byFolder) {
        const htmlFiles = record.htmlFiles.sort((a, b) => {
          if (a.toLowerCase() === 'index.html') return -1;
          if (b.toLowerCase() === 'index.html') return 1;
          return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
        });
        if (!htmlFiles.some(file => file.toLowerCase() === 'index.html')) continue;
        const coverPath = chooseCover(folder, record.pngPaths);
        result.push({
          folder,
          title: humanizeFolder(folder),
          htmlFiles,
          coverPath,
          searchText: (folder + ' ' + humanizeFolder(folder)).toLowerCase()
        });
      }
      return result.sort((a, b) => a.title.localeCompare(b.title, undefined, { numeric: true, sensitivity: 'base' }));
    }

    function updateSearchUrl() {
      const url = new URL(window.location.href);
      const query = searchBar.value.trim();
      if (query) url.searchParams.set('q', query);
      else url.searchParams.delete('q');
      window.history.replaceState({}, '', url.pathname + url.search + url.hash);
    }

    function applySearch() {
      const query = searchBar.value.trim().toLowerCase();
      visibleGames = games.filter(game => !query || game.searchText.includes(query));
      renderGames();
      updateSearchUrl();
    }

    function makeCard(game) {
      const card = document.createElement('article');
      card.className = 'game-card';
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
      card.setAttribute('aria-label', 'Play ' + game.title);

      const img = document.createElement('img');
      img.className = 'game-thumbnail';
      img.loading = 'lazy';
      img.alt = game.title + ' cover';
      if (game.coverPath) {
        img.src = CDN_ROOT + encodePath(game.coverPath);
        img.onerror = () => {
          img.onerror = null;
          img.src = `https://github.com/${OWNER}.png?size=320`;
          img.alt = 'No cover image available for ' + game.title;
        };
      } else {
        img.src = `https://github.com/${OWNER}.png?size=320`;
        img.alt = 'No cover image available for ' + game.title;
      }
      card.appendChild(img);

      const heading = document.createElement('h3');
      heading.textContent = game.title;
      card.appendChild(heading);

      const description = document.createElement('p');
      description.textContent = game.htmlFiles.length > 1
        ? game.htmlFiles.length + ' HTML files'
        : 'Open game';
      card.appendChild(description);

      const folder = document.createElement('span');
      folder.className = 'game-folder-name';
      folder.textContent = game.folder + '/';
      card.appendChild(folder);

      card.addEventListener('click', () => openGame(game));
      card.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openGame(game);
        }
      });
      return card;
    }

    function renderGames() {
      container.replaceChildren();
      const fragment = document.createDocumentFragment();
      visibleGames.forEach(game => fragment.appendChild(makeCard(game)));
      if (!visibleGames.length) {
        const empty = document.createElement('p');
        empty.id = 'gamesEmpty';
        empty.textContent = games.length ? 'No games match that search.' : 'No game folders containing an index.html were found.';
        fragment.appendChild(empty);
      }
      container.appendChild(fragment);
      totalEl.textContent = games.length ? `${visibleGames.length} of ${games.length} games` : '';
    }

    function setStatus(message) {
      statusEl.textContent = message;
    }

    async function loadGames(forceRefresh = false) {
      if (isLoading) return;
      isLoading = true;
      const cached = (() => {
        try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); }
        catch (_) { return null; }
      })();

      if (!forceRefresh && cached && Array.isArray(cached.games) && Date.now() - cached.savedAt < CACHE_TTL) {
        games = cached.games;
        applySearch();
        setStatus('Loaded the saved game list.');
        isLoading = false;
        return;
      }

      setStatus('Fetching game folders from hummingbird-9/games…');
      totalEl.textContent = 'Loading…';
      try {
        const response = await fetch(TREE_API, { headers: { Accept: 'application/vnd.github+json' } });
        if (!response.ok) {
          if (response.status === 403) throw new Error('GitHub API rate limit reached. Try Refresh again later.');
          if (response.status === 404) throw new Error('The games repository or main branch could not be found.');
          throw new Error('GitHub returned HTTP ' + response.status + '.');
        }
        const data = await response.json();
        if (!Array.isArray(data.tree)) throw new Error('GitHub returned an unexpected repository tree.');
        if (data.truncated) throw new Error('GitHub returned a truncated file tree, so the full game list could not be read.');

        games = makeCatalog(data.tree);
        localStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), games }));
        applySearch();
        setStatus(`Found ${games.length} games from the GitHub folders.`);
      } catch (error) {
        console.error('Game catalog load failed:', error);
        if (cached && Array.isArray(cached.games) && cached.games.length) {
          games = cached.games;
          applySearch();
          setStatus('Could not refresh GitHub (' + error.message + '). Showing the last saved game list.');
        } else {
          games = [];
          visibleGames = [];
          renderGames();
          setStatus('Could not load the game list: ' + error.message);
        }
      } finally {
        isLoading = false;
      }
    }

    function setHtmlChoices(game) {
      htmlSelector.replaceChildren();
      game.htmlFiles.forEach(file => {
        const option = document.createElement('option');
        option.value = file;
        option.textContent = file;
        htmlSelector.appendChild(option);
      });
      htmlSelector.disabled = false;
      htmlSelector.title = game.htmlFiles.length > 1
        ? 'Choose which HTML file to play for this game'
        : 'This game has one entry point: index.html';
      htmlSelector.value = game.htmlFiles[0] || 'index.html';
    }

    function createGameFrame() {
      const oldFrame = document.getElementById('gameFrame');
      if (oldFrame) oldFrame.remove();
      const frame = document.createElement('iframe');
      frame.id = 'gameFrame';
      frame.title = activeGame ? activeGame.title : 'Selected game';
      frame.allow = 'autoplay; fullscreen; gamepad; clipboard-read; clipboard-write';
      frame.allowFullscreen = true;
      frameWrap.appendChild(frame);
      return frame;
    }

    function loadActiveHtml() {
      if (!activeGame) return;
      activeHtml = htmlSelector.value || 'index.html';
      const frame = createGameFrame();
      frame.src = gameUrl(activeGame, activeHtml);
    }

    function openGame(game) {
      activeGame = game;
      activeHtml = game.htmlFiles[0] || 'index.html';
      viewerTitle.textContent = game.title;
      setHtmlChoices(game);
      viewer.classList.add('is-open');
      viewer.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      loadActiveHtml();
      document.getElementById('closeGame').focus();
    }

    function closeGame() {
      viewer.classList.remove('is-open');
      viewer.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      activeGame = null;
      const frame = document.getElementById('gameFrame');
      if (frame) {
        frame.src = 'about:blank';
        frame.remove();
      }
      htmlSelector.replaceChildren();
      const option = document.createElement('option');
      option.value = '';
      option.textContent = 'HTML file — open a game first';
      htmlSelector.appendChild(option);
      htmlSelector.disabled = true;
      htmlSelector.title = 'Choose a game first';
    }

    function openGameInNewTab() {
      if (!activeGame) return;
      window.open(gameUrl(activeGame, htmlSelector.value || activeHtml), '_blank', 'noopener');
    }

    async function openGameInAboutBlank() {
      if (!activeGame) return;
      const game = activeGame;
      const file = htmlSelector.value || activeHtml || 'index.html';
      const popup = window.open('about:blank', '_blank');
      if (!popup) {
        alert('Your browser blocked the new tab. Allow pop-ups for this site and try again.');
        return;
      }
      popup.document.open();
      popup.document.write('<!doctype html><title>Loading game…</title><body style="font:16px sans-serif;padding:2em">Loading game…</body>');
      popup.document.close();
      try {
        const response = await fetch(gameUrl(game, file));
        if (!response.ok) throw new Error('HTTP ' + response.status);
        let html = await response.text();
        html = html.replace(/<base\b[^>]*>/ig, '');
        const baseTag = '<base href="' + folderUrl(game) + '">';
        if (/<head\b[^>]*>/i.test(html)) html = html.replace(/<head\b[^>]*>/i, match => match + baseTag);
        else html = '<!doctype html><html><head>' + baseTag + '</head><body>' + html + '</body></html>';
        popup.document.open();
        popup.document.write(html);
        popup.document.close();
      } catch (error) {
        popup.document.body.textContent = 'Could not load this game: ' + error.message;
      }
    }

    document.getElementById('refreshGames').addEventListener('click', () => loadGames(true));
    searchBar.addEventListener('input', applySearch);
    htmlSelector.addEventListener('change', loadActiveHtml);
    document.getElementById('closeGame').addEventListener('click', closeGame);
    document.getElementById('newTabGame').addEventListener('click', openGameInNewTab);
    document.getElementById('aboutBlankGame').addEventListener('click', openGameInAboutBlank);
    viewer.addEventListener('click', event => { if (event.target === viewer) closeGame(); });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && viewer.classList.contains('is-open')) closeGame();
    });

    const initialQuery = new URLSearchParams(window.location.search).get('q') || '';
    searchBar.value = initialQuery;
    loadGames(false);
  })();
  </script>
</body>
</html>
