  <script>
  (() => {
    'use strict';

    const OWNER = 'hummingbird-9';
    const HTML_REPO = 'html';
    const ASSETS_REPO = 'assets';
    const COVERS_CDN = 'https://cdn.jsdelivr.net/gh/hummingbird-9/covers@main';
    const HTML_CDN = 'https://cdn.jsdelivr.net/gh/hummingbird-9/html@main';
    const ASSETS_CDN = 'https://cdn.jsdelivr.net/gh/hummingbird-9/assets@main';
    const API = 'https://api.github.com/repos/' + OWNER + '/';
    const PAGE_SIZE = 36;
    const CACHE_KEY = 'hummingbird-view-games-v1';
    const CACHE_TTL = 6 * 60 * 60 * 1000;
    const knownNames = JSON.parse(document.getElementById('knownGameNames').textContent);

    const container = document.getElementById('container');
    const searchBar = document.getElementById('searchBar');
    const sortOptions = document.getElementById('sortOptions');
    const statusEl = document.getElementById('gamesStatus');
    const totalEl = document.getElementById('gamesTotal');
    const loadMoreBtn = document.getElementById('gamesLoadMore');
    const viewer = document.getElementById('zoneViewer');
    const nameEl = document.getElementById('zoneName');
    const idEl = document.getElementById('zoneId');

    let games = [];
    let filteredGames = [];
    let renderedCount = 0;
    let activeGame = null;
    let activeHtml = '';
    let isLoading = false;

    function parseId(filename) {
      const match = filename.match(/^(\d+)/);
      return match ? Number(match[1]) : null;
    }

    function fallbackTitle(filename, id) {
      const stem = filename.replace(/\.html?$/i, '');
      const suffix = stem.replace(/^\d+/, '').replace(/^[-_.\s]+/, '');
      if (!suffix) return 'Game ' + id;
      return suffix.replace(/[-_.]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    function friendlyTitle(filename, id) {
      return knownNames[filename] || fallbackTitle(filename, id);
    }

    async function fetchRootEntries(repo) {
      const entries = [];
      for (let page = 1; page <= 20; page++) {
        const url = API + encodeURIComponent(repo) + '/contents/?ref=main&per_page=100&page=' + page;
        const response = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
        if (!response.ok) {
          if (response.status === 404) throw new Error('Could not find the public ' + repo + ' repository or its main branch.');
          if (response.status === 403) throw new Error('GitHub API rate limit reached. Try Refresh Game List in a little while.');
          throw new Error('GitHub returned HTTP ' + response.status + ' while reading ' + repo + '.');
        }
        const batch = await response.json();
        if (!Array.isArray(batch)) throw new Error('Unexpected GitHub response for ' + repo + '.');
        entries.push(...batch);
        if (batch.length < 100) break;
      }
      return entries;
    }

    async function loadRepositoryData(force = false) {
      if (isLoading) return;
      isLoading = true;
      statusEl.textContent = 'Checking the game and asset repositories...';
      totalEl.textContent = 'Loading...';
      try {
        if (!force) {
          const cached = localStorage.getItem(CACHE_KEY);
          if (cached) {
            const parsed = JSON.parse(cached);
            if (Date.now() - parsed.savedAt < CACHE_TTL && Array.isArray(parsed.games) && Array.isArray(parsed.assetIds)) {
              games = parsed.games;
              assetFolders = new Set(parsed.assetIds);
              applyFilterAndRender();
              statusEl.textContent = 'Loaded the saved repository list. Use Refresh Game List to check for new uploads.';
              isLoading = false;
              return;
            }
          }
        }

        const [htmlEntries, assetEntries] = await Promise.all([
          fetchRootEntries(HTML_REPO),
          fetchRootEntries(ASSETS_REPO)
        ]);

        const fileEntries = htmlEntries.filter(entry => entry.type === 'file' && !entry.path.includes('/') && /^\d+.*\.html?$/i.test(entry.name));
        const assetIds = assetEntries.filter(entry => entry.type === 'dir' && /^\d+$/.test(entry.name)).map(entry => entry.name);
        assetFolders = new Set(assetIds);

        games = fileEntries.map(entry => {
          const id = parseId(entry.name);
          return {
            id,
            filename: entry.name,
            title: friendlyTitle(entry.name, id),
            hasAssets: assetFolders.has(String(id)),
            path: entry.path
          };
        }).filter(game => Number.isFinite(game.id));

        games.sort((a, b) => a.id - b.id || a.filename.localeCompare(b.filename, undefined, { numeric: true, sensitivity: 'base' }));
        localStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), games, assetIds }));
        applyFilterAndRender();
        statusEl.textContent = 'Game list discovered directly from the HTML repository. New HTML files appear after a refresh.';
      } catch (error) {
        console.error(error);
        statusEl.textContent = error.message + ' Check your connection and try Refresh Game List.';
        totalEl.textContent = 'Game list unavailable';
      } finally {
        isLoading = false;
      }
    }

    let assetFolders = new Set();

    function applyFilterAndRender() {
      const query = searchBar.value.trim().toLowerCase();
      filteredGames = games.filter(game => game.title.toLowerCase().includes(query) || game.filename.toLowerCase().includes(query));
      if (sortOptions.value === 'name') {
        filteredGames.sort((a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: 'base' }) || a.id - b.id);
      } else {
        filteredGames.sort((a, b) => a.id - b.id || a.filename.localeCompare(b.filename, undefined, { numeric: true, sensitivity: 'base' }));
      }
      renderedCount = 0;
      container.replaceChildren();
      totalEl.textContent = filteredGames.length + ' HTMLs found';
      renderNextPage();
    }

    function makeCard(game) {
      const card = document.createElement('article');
      card.className = 'zone-item game-card';
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
      card.setAttribute('aria-label', 'Open ' + game.title);

      const img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = game.title + ' cover';
      img.src = COVERS_CDN + '/' + game.id + '.png';
      img.onerror = () => {
        img.onerror = null;
        img.src = 'https://github.com/' + OWNER + '.png?size=320';
        img.alt = 'No cover available for ' + game.title;
      };
      card.appendChild(img);

      const titleButton = document.createElement('button');
      titleButton.type = 'button';
      titleButton.textContent = game.title;
      titleButton.addEventListener('click', event => { event.stopPropagation(); openGame(game); });
      card.appendChild(titleButton);

      const filename = document.createElement('span');
      filename.className = 'game-filename';
      filename.textContent = game.filename;
      card.appendChild(filename);

      card.addEventListener('click', () => openGame(game));
      card.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openGame(game); }
      });
      return card;
    }

    function renderNextPage() {
      const batch = filteredGames.slice(renderedCount, renderedCount + PAGE_SIZE);
      const fragment = document.createDocumentFragment();
      batch.forEach(game => fragment.appendChild(makeCard(game)));
      container.appendChild(fragment);
      renderedCount += batch.length;
      loadMoreBtn.hidden = renderedCount >= filteredGames.length;
      loadMoreBtn.textContent = 'Load More (' + (filteredGames.length - renderedCount) + ' HTMLs remaining)';
      if (!filteredGames.length && games.length) statusEl.textContent = 'No HTMLs match that search.';
    }

    function gameBaseUrl(game) {
      return game.hasAssets ? ASSETS_CDN + '/' + game.id + '/' : HTML_CDN + '/';
    }

    function addGameBase(html, game) {
      const baseTag = '<base href="' + gameBaseUrl(game) + '">';
      const withoutOldBase = html.replace(/<base\b[^>]*>/ig, '');
      if (/<head\b[^>]*>/i.test(withoutOldBase)) return withoutOldBase.replace(/<head\b[^>]*>/i, match => match + baseTag);
      return '<!doctype html><html><head><meta charset="utf-8">' + baseTag + '</head><body>' + withoutOldBase + '</body></html>';
    }

    async function fetchGameHtml(game) {
      const url = HTML_CDN + '/' + encodeURIComponent(game.filename);
      const response = await fetch(url);
      if (!response.ok) throw new Error('Could not load ' + game.filename + ' (HTTP ' + response.status + ').');
      return addGameBase(await response.text(), game);
    }

    function createFrame() {
      const frame = document.createElement('iframe');
      frame.id = 'zoneFrame';
      frame.title = 'Selected game';
      frame.allow = 'autoplay; fullscreen; gamepad; clipboard-read; clipboard-write';
      frame.allowFullscreen = true;
      const previous = document.getElementById('zoneFrame');
      if (previous) previous.replaceWith(frame);
      else viewer.appendChild(frame);
      return frame;
    }

    async function openGame(game) {
      activeGame = game;
      activeHtml = '';
      nameEl.textContent = game.title;
      idEl.textContent = '#' + game.id;
      viewer.style.display = 'block';
      const frame = createFrame();
      frame.srcdoc = '<!doctype html><html><body style="font:16px sans-serif;background:#111;color:#fff;display:grid;place-items:center;height:90vh"><p>Loading ' + game.title.replace(/[&<>"']/g, '') + '...</p></body></html>';
      try {
        activeHtml = await fetchGameHtml(game);
        if (activeGame === game && frame.isConnected) frame.srcdoc = activeHtml;
      } catch (error) {
        console.error(error);
        if (activeGame === game && frame.isConnected) frame.srcdoc = '<!doctype html><title>Load failed</title><body style="font:16px sans-serif;padding:2em"><h2>Could not load this game</h2><p>' + error.message.replace(/[&<>"']/g, '') + '</p><p>Try Open in New Tab or check the repository file.</p></body>';
      }
    }

    function closeGame() {
      viewer.style.display = 'none';
      activeGame = null;
      activeHtml = '';
      const frame = document.getElementById('zoneFrame');
      if (frame) {
        frame.src = 'about:blank';
        frame.remove();
      }
      const fresh = document.createElement('iframe');
      fresh.id = 'zoneFrame';
      fresh.title = 'Selected game';
      fresh.allow = 'autoplay; fullscreen; gamepad; clipboard-read; clipboard-write';
      fresh.allowFullscreen = true;
      document.getElementById('zoneViewer').appendChild(fresh);
    }

    async function openGameInNewTab() {
      if (!activeGame) return;
      const popup = window.open('about:blank', '_blank');
      if (!popup) { alert('Your browser blocked the new tab. Allow pop-ups for this site and try again.'); return; }
      popup.document.write('<!doctype html><title>Loading game...</title><body style="font:16px sans-serif;padding:2em">Loading game...</body>');
      popup.document.close();
      try {
        const html = activeHtml || await fetchGameHtml(activeGame);
        popup.document.open();
        popup.document.write(html);
        popup.document.close();
      } catch (error) {
        popup.document.body.textContent = 'Could not load this game: ' + error.message;
      }
    }

    document.getElementById('closeGame').addEventListener('click', closeGame);
    document.getElementById('fullscreenGame').addEventListener('click', () => {
      const frame = document.getElementById('zoneFrame');
      if (frame && frame.requestFullscreen) frame.requestFullscreen();
    });
    document.getElementById('newTabGame').addEventListener('click', openGameInNewTab);
    document.getElementById('refreshGames').addEventListener('click', () => loadRepositoryData(true));
    loadMoreBtn.addEventListener('click', renderNextPage);
    searchBar.addEventListener('input', applyFilterAndRender);
    sortOptions.addEventListener('change', applyFilterAndRender);
    document.getElementById('darkModeToggle').addEventListener('click', () => document.body.classList.toggle('dark-mode'));
    document.addEventListener('keydown', event => { if (event.key === 'Escape' && viewer.style.display === 'block') closeGame(); });

    loadRepositoryData(false);
  })();
  </script>
