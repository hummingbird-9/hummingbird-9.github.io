            if (!remainder) return 'Game ' + id;
            return remainder.replace(/[-_.]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        }

        function titleFor(filename, id) {
            return knownNames[filename] || fallbackTitle(filename, id);
        }

        function uniqueByFilename(items) {
            const unique = new Map();
            for (const item of items) {
                if (!item || typeof item.filename !== 'string') continue;
                const key = item.filename.toLowerCase();
                if (!unique.has(key)) unique.set(key, item);
            }
            return Array.from(unique.values());
        }

        // GitHub's Contents API returns a directory listing in one response (up to 1,000 entries).
        // It does not provide page-based pagination for a single directory. Re-requesting it with
        // ?page=1, ?page=2, etc. repeats the same files and created the 13,840-entry duplicate list.
        async function fetchRootEntries(repo) {
            const url = API_ROOT + encodeURIComponent(repo) + '/contents/?ref=main';
            const response = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
            if (!response.ok) {
                if (response.status === 404) throw new Error('Could not find the public ' + repo + ' repository or its main branch.');
                if (response.status === 403) throw new Error('GitHub API rate limit reached. Wait a little while, then reload this page.');
                throw new Error('GitHub returned HTTP ' + response.status + ' while reading ' + repo + '.');
            }
            const entries = await response.json();
            if (!Array.isArray(entries)) throw new Error('Unexpected GitHub response for ' + repo + '.');
            return entries;
        }

        function getCachedGames() {
            try {
                const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
                if (!cached || Date.now() - cached.savedAt >= CACHE_TTL || !Array.isArray(cached.games) || !Array.isArray(cached.assetIds)) return null;
                return {
                    games: uniqueByFilename(cached.games),
                    assetIds: [...new Set(cached.assetIds.map(String))]
                };
            } catch (_) {
                return null;
            }
        }

        async function loadGames(force = false) {
            if (loading) return;
            loading = true;
            zoneCount.textContent = 'Loading HTML list...';
            container.textContent = 'Loading...';

            try {
                if (!force) {
                    const cached = getCachedGames();
                    if (cached) {
                        games = cached.games;
                        assetFolders = new Set(cached.assetIds);
                        filterGames();
                        loading = false;
                        return;
                    }
                }

                const [htmlEntries, assetEntries] = await Promise.all([
                    fetchRootEntries(HTML_REPO),
                    fetchRootEntries(ASSETS_REPO)
                ]);

                const rootHtmlEntries = htmlEntries.filter(entry =>
                    entry && entry.type === 'file' &&
                    typeof entry.name === 'string' &&
                    !String(entry.path || entry.name).includes('/') &&
                    /^\d+.*\.html?$/i.test(entry.name)
                );

                // Extra de-duplication protects against duplicate names in an unexpected API/cache response.
                const uniqueEntries = new Map();
                for (const entry of rootHtmlEntries) {
                    const key = entry.name.toLowerCase();
                    if (!uniqueEntries.has(key)) uniqueEntries.set(key, entry);
                }

                const assetIds = [...new Set(assetEntries
                    .filter(entry => entry && entry.type === 'dir' && /^\d+$/.test(entry.name))
                    .map(entry => String(entry.name)))];
                assetFolders = new Set(assetIds);

                games = Array.from(uniqueEntries.values()).map(entry => {
                    const id = numericId(entry.name);
                    return {
                        id,
                        filename: entry.name,
                        title: titleFor(entry.name, id),
                        hasAssets: assetFolders.has(String(id))
                    };
                }).filter(game => Number.isFinite(game.id));

                localStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), games, assetIds }));
                filterGames();
            } catch (error) {
                console.error(error);
                zoneCount.textContent = 'Could not load HTMLs';
                container.textContent = error.message + ' Reload the page to try again.';
            } finally {
                loading = false;
            }
        }

        function filterGames() {
            const query = searchBar.value.trim().toLowerCase();
            filteredGames = games.filter(game => game.title.toLowerCase().includes(query) || game.filename.toLowerCase().includes(query));

            if (sortOptions.value === 'name') {
                filteredGames.sort((a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: 'base' }) || a.id - b.id || a.filename.localeCompare(b.filename));
            } else if (sortOptions.value === 'id') {
                filteredGames.sort((a, b) => a.id - b.id || a.filename.localeCompare(b.filename, undefined, { numeric: true, sensitivity: 'base' }));
            }

            currentPage = 0;
            container.replaceChildren();
            displayGamesPaginated();
        }

        function displayGamesPaginated() {
            const start = currentPage * gamesPerPage;
            const end = Math.min(start + gamesPerPage, filteredGames.length);
            const fragment = document.createDocumentFragment();

            filteredGames.slice(start, end).forEach(game => {
                const item = document.createElement('div');
                item.className = 'zone-item';
                item.addEventListener('click', () => openGame(game));

                const img = document.createElement('img');
                img.loading = 'lazy';
                img.alt = game.title + ' cover';
                img.src = COVERS_CDN + '/' + game.id + '.png';
                img.onerror = () => {
                    img.onerror = null;
                    img.src = 'https://github.com/' + OWNER + '.png?size=320';
                };
                item.appendChild(img);

                const button = document.createElement('button');
                button.type = 'button';
                button.textContent = game.title;
                button.addEventListener('click', event => {
                    event.stopPropagation();
                    openGame(game);
                });
                item.appendChild(button);
                fragment.appendChild(item);
            });

            container.appendChild(fragment);
            zoneCount.textContent = 'HTMLs Loaded: ' + end + ' of ' + filteredGames.length;
            updateLoadMore(end < filteredGames.length);

            if (filteredGames.length === 0) {
                container.textContent = games.length ? 'No HTMLs match your search.' : 'No HTML files were found.';
            }
        }

        function updateLoadMore(show) {
            let button = document.getElementById('loadMoreBtn');
            if (show) {
                if (!button) {
                    button = document.createElement('button');
                    button.id = 'loadMoreBtn';
                    button.textContent = 'Load More';
                    button.style.display = 'block';
                    button.style.margin = '20px auto';
                    button.style.padding = '10px 20px';
                    button.style.fontSize = '16px';
                    button.addEventListener('click', () => {
                        currentPage++;
                        displayGamesPaginated();
                    });
                    container.parentElement.appendChild(button);
                }
            } else if (button) {
                button.remove();
            }
        }

        function baseUrlFor(game) {
            return game.hasAssets ? ASSETS_CDN + '/' + game.id + '/' : HTML_CDN + '/';
        }

        function withGameBase(html, game) {
            const baseTag = '<base href="' + baseUrlFor(game) + '">';
            const withoutBase = html.replace(/<base\b[^>]*>/ig, '');
            if (/<head\b[^>]*>/i.test(withoutBase)) {
                return withoutBase.replace(/<head\b[^>]*>/i, head => head + baseTag);
            }
            return '<!doctype html><html><head><meta charset="utf-8">' + baseTag + '</head><body>' + withoutBase + '</body></html>';
        }

        async function fetchGameHtml(game) {
            const url = HTML_CDN + '/' + encodeURIComponent(game.filename);
            const response = await fetch(url);
            if (!response.ok) throw new Error('Could not load ' + game.filename + ' (HTTP ' + response.status + ').');
            return withGameBase(await response.text(), game);
        }

        function currentFrame() {
            return document.getElementById('zoneFrame');
        }

        async function openGame(game) {
            activeGame = game;
            activeGameHtml = '';
            zoneNameText.textContent = game.title;
            zoneIdText.textContent = game.filename;
            zoneViewer.style.display = 'block';

            const frame = currentFrame();
            if (!frame) return;
            const loadingDoc = '<!doctype html><html><body style="font:16px sans-serif;background:#111;color:#fff;display:grid;place-items:center;height:90vh"><p>Loading...</p></body></html>';
            frame.srcdoc = loadingDoc;

            try {
                const html = await fetchGameHtml(game);
                if (activeGame !== game || !frame.isConnected) return;
                activeGameHtml = html;
                const doc = frame.contentDocument;
                doc.open();
                doc.write(html);
                doc.close();
            } catch (error) {
                console.error(error);
                if (activeGame === game && frame.isConnected) {
                    const doc = frame.contentDocument;
                    doc.open();
                    doc.write('<!doctype html><html><body style="font:16px sans-serif;padding:2em"><h2>Could not load this game</h2></body></html>');
                    doc.close();
                    alert(error.message);
                }
            }
        }

        function closeGame() {
            zoneViewer.style.display = 'none';
            activeGame = null;
            activeGameHtml = '';
            const oldFrame = currentFrame();
            if (oldFrame) {
                oldFrame.src = 'about:blank';
                oldFrame.remove();
            }
            const freshFrame = document.createElement('iframe');
            freshFrame.id = 'zoneFrame';
            freshFrame.title = 'Selected HTML game';
            freshFrame.allow = 'autoplay; fullscreen; gamepad; clipboard-read; clipboard-write';
            freshFrame.allowFullscreen = true;
            zoneViewer.appendChild(freshFrame);
        }

        function fullscreenGame() {
            const frame = currentFrame();
            if (frame && frame.requestFullscreen) frame.requestFullscreen();
            else if (frame && frame.webkitRequestFullscreen) frame.webkitRequestFullscreen();
        }

        function openAboutBlank() {
            if (!activeGame) return;
            const game = activeGame;
            const popup = window.open('about:blank', '_blank');
            if (!popup) {
                alert('Your browser blocked the new tab. Allow pop-ups for this site and try again.');
                return;
            }
            popup.document.open();
            popup.document.write('<!doctype html><title>Loading game...</title><body style="font:16px sans-serif;padding:2em">Loading game...</body>');
            popup.document.close();

            const htmlPromise = activeGameHtml ? Promise.resolve(activeGameHtml) : fetchGameHtml(game);
            htmlPromise.then(html => {
                if (popup.closed) return;
                popup.document.open();
                popup.document.write(html);
                popup.document.close();
            }).catch(error => {
                if (!popup.closed) popup.document.body.textContent = 'Could not load this game: ' + error.message;
            });
        }

        function saveData() {
            const data = JSON.stringify(localStorage) + '\n\n|\n\n' + document.cookie;
            const link = document.createElement('a');
            link.href = URL.createObjectURL(new Blob([data], { type: 'text/plain' }));
            link.download = Date.now() + '.data';
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(link.href);
        }

        function loadData(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                const parts = String(e.target.result).split('\n\n|\n\n');
                try {
                    const stored = JSON.parse(parts[0]);
                    for (const key in stored) localStorage.setItem(key, stored[key]);
                } catch (_) {
                    alert('Failed to parse local storage data');
                    return;
                }
                if (parts[1]) parts[1].split('; ').forEach(cookie => { document.cookie = cookie; });
                alert('Data loaded successfully');
            };
            reader.readAsText(file);
        }

        window.saveData = saveData;
        window.loadData = loadData;
        window.closeZone = closeGame;
        window.fullscreenZone = fullscreenGame;
        window.aboutBlank = openAboutBlank;

        searchBar.addEventListener('input', filterGames);
        sortOptions.addEventListener('change', filterGames);
        darkModeToggle.addEventListener('click', () => document.body.classList.toggle('dark-mode'));
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && zoneViewer.style.display === 'block') closeGame();
        });

        // Load the one-time root directory listing, then render each filename only once.
        loadGames(false);
    })();
    </script>
</body>
</html>
