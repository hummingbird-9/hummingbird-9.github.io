<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HummingProxy | Web</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#082510,#205e2d);color:#edffef}
header{min-height:54px;display:flex;align-items:center;gap:13px;padding:9px 15px;background:#112c1b;border-bottom:1px solid #5ba879}
header img{height:35px;max-width:75px;object-fit:contain}
header strong{font-size:16px}
header a{margin-left:auto;color:white;background:#276b3c;padding:9px 14px;border-radius:8px;text-decoration:none;border:1px solid #86d9a1}
header a:hover{background:#37844d}
main{height:calc(100dvh - 54px);position:relative}
iframe{display:block;width:100%;height:100%;border:0;background:white}
.info{position:absolute;bottom:12px;right:12px;background:#112d21ec;border:1px solid #75b88a;border-radius:8px;padding:10px 13px;max-width:min(430px,calc(100% - 24px));font-size:12px;line-height:1.45}
.info button{background:transparent;color:#e4ffe7;border:1px solid #85ca9b;border-radius:5px;margin-left:8px;cursor:pointer}
@media(max-width:540px){header{gap:7px;padding:8px}header strong{font-size:13px}header a{font-size:12px;padding:8px}.info{left:12px;right:12px}}
</style>
</head>
<body>
<header>
<img src="https://uploads.onecompiler.io/447kr4gf2/44f9wbztv/humming%5Bbird%5DTech%20logo%20%284%29.png" alt="" onerror="this.hidden=true">
<strong>HummingProxy</strong>
</header>
<main>
<iframe src="https://hummingproxy-saj5.onrender.com/" title="HummingProxy browser" allow="fullscreen; clipboard-read; clipboard-write" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
</main>
<script>document.getElementById('dismiss').onclick=()=>document.getElementById('hint').remove()</script>
</body>
</html>
