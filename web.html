<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Search the HummingWeb</title>
  <script>
    (() => {
      const incoming = new URLSearchParams(window.location.search);
      if (!incoming.has('q')) return;
      const target = new URL('/HummingEngine/', window.location.origin);
      for (const key of ['q', 'open', 'popup']) {
        if (incoming.has(key)) target.searchParams.set(key, incoming.get(key) || '');
      }
      window.location.replace(target.href);
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=20261126-logo-game-overlay-fix-2">
  <link rel="shortcut icon" href="https://uploads.onecompiler.io/447kr4gf2/44f9wbztv/humming%5Bbird%5DTech%20logo%20(5).png">
  <style>
    /* Give the remote proxy the widest and tallest practical browsing area. */
    body.web-page {
      display:flex;
      flex-direction:column;
      align-items:stretch;
      justify-content:flex-start;
      width:100%;
      height:auto;
      min-height:100vh;
      min-height:100dvh;
      padding:16px 10px 12px;
      overflow-x:hidden;
      overflow-y:auto;
      text-align:left;
    }
    .web-controls {
      display:flex;
      flex:0 0 auto;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      width:100%;
      min-height:30px;
      margin:0 0 4px;
      color:var(--page-muted);
      font-size:.82rem;
    }
    .web-controls button { min-height:30px; padding:5px 11px; }
    .web-viewport {
      position:relative;
      flex:0 0 auto;
      align-self:center;
      width:min(100%, 1700px, calc((100dvh - 125px) * (16 / 9)));
      max-height:calc(100dvh - 125px);
      aspect-ratio:16 / 9;
      margin:0;
      overflow:hidden;
      border:1px solid var(--panel-border);
      border-radius:var(--corner-radius);
      background:#10291a;
      --web-frame-scale:.82;
    }
    /* The proxy receives a larger virtual viewport, scaled down to show more at once. */
    .web-viewport iframe {
      position:absolute;
      top:0;
      left:0;
      display:block;
      width:1700px;
      height:956.25px;
      max-width:none;
      max-height:none;
      border:0;
      background:#10291a;
      transform:scale(var(--web-frame-scale));
      transform-origin:top left;
    }
    .web-viewport:fullscreen {
      width:100% !important;
      height:100% !important;
      max-height:none;
      aspect-ratio:auto;
      border:0;
      border-radius:0;
    }
    .web-viewport:fullscreen iframe { width:100%; height:100%; transform:none; }
    @media(max-width:760px) {
      body.web-page { padding:12px 5px 5px; }
      .web-controls { margin-bottom:4px; }
    }
  </style>
</head>
<body class="web-page">
  <div class="web-controls"><span>HummingWeb</span><button id="webFullscreenBtn" class="utility-btn" type="button">Fullscreen</button></div>
  <main class="web-viewport" id="webViewport">
    <iframe id="webProxyFrame" src="/HummingEngine/" title="HummingWeb search" allow="fullscreen; clipboard-read; clipboard-write" loading="eager"></iframe>
  </main>
  <script src="global-utils.js?v=20261127-correct-original-sprites-4"></script>
  <script>
    (() => {
      const viewport = document.getElementById('webViewport');
      const button = document.getElementById('webFullscreenBtn');
      const proxyFrame = document.getElementById('webProxyFrame');
      const incoming = new URLSearchParams(window.location.search);
      for (const key of ['q', 'open', 'popup']) {
        if (incoming.has(key)) {
          const target = new URL(proxyFrame.src);
          target.searchParams.set(key, incoming.get(key) || '');
          proxyFrame.src = target.href;
        }
      }
      const BASE_WIDTH = 1700;
      const ASPECT_RATIO = 16 / 9;
      
      function getMaximumWidth() {
        const availableHeight = Math.max(200, window.innerHeight - 125);
        const availableWidth = Math.max(240, window.innerWidth - 24);
        return Math.min(BASE_WIDTH, availableWidth, availableHeight * ASPECT_RATIO);
      }

      function applyFrameWidth(width) {
        const clampedWidth = Math.max(240, Math.min(getMaximumWidth(), width));
        viewport.style.width = clampedWidth + 'px';
        viewport.style.setProperty('--web-frame-scale', String(clampedWidth / BASE_WIDTH));
      }

      // Keep the largest responsive size that fits, preserving the 16:9 ratio.
      applyFrameWidth(getMaximumWidth());
      window.addEventListener('resize', () => applyFrameWidth(getMaximumWidth()));

      async function toggleFullscreen() {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else if (viewport.requestFullscreen) await viewport.requestFullscreen();
          else {
            const frame = viewport.querySelector('iframe');
            if (frame && frame.requestFullscreen) await frame.requestFullscreen();
            else throw new Error('Fullscreen is not available in this browser.');
          }
        } catch (error) {
          console.warn('Could not enter fullscreen:', error);
          button.textContent = 'Fullscreen unavailable';
        }
      }
      button.addEventListener('click', toggleFullscreen);
      document.addEventListener('fullscreenchange', () => {
        button.textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
      });
    })();
  </script>
</body>
</html>
