<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API proxy bridge</title></head><body>
<script type="module">
(() => {
 'use strict';
 const root=new URL('./',location.href);
 const asset=name=>new URL(name,root);
 const assetPath=name=>asset(name).pathname;
 const activeRequests=new Map();
 let controller=null,mux=null,setupPromise=null;
 const send=message=>{try{parent.postMessage(message,location.origin)}catch(_){}};
 function waitForController() {
  return new Promise((resolve,reject)=>{
   if(navigator.serviceWorker.controller){resolve();return}
   const timer=setTimeout(()=>{navigator.serviceWorker.removeEventListener('controllerchange',changed);reject(new Error('Proxy service worker did not take control.'))},20000);
   function changed(){if(!navigator.serviceWorker.controller)return;clearTimeout(timer);navigator.serviceWorker.removeEventListener('controllerchange',changed);resolve()}
   navigator.serviceWorker.addEventListener('controllerchange',changed);
  });
 }
 function loadScript(url){return new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=url.href;script.onload=resolve;script.onerror=()=>reject(new Error('Could not load local proxy transport helper.'));document.head.appendChild(script)})}
 async function setup(){
  await import(asset('scramjet-engine/scramjet.js').href);
  if(!window.$scramjetLoadController)throw new Error('Scramjet controller did not load.');
  const {ScramjetController}=window.$scramjetLoadController();
  controller=new ScramjetController({prefix:assetPath('scramjet/'),files:{wasm:assetPath('scramjet-engine/scramjet.wasm'),all:assetPath('scramjet-engine/scramjet-all.js'),sync:assetPath('scramjet-engine/scramjet-sync.js')}});
  await controller.init();
  const registration=await navigator.serviceWorker.register(asset('sw.js').href,{scope:root.pathname,updateViaCache:'none'});
  await navigator.serviceWorker.ready;
  await waitForController();
  if(!window._0zzl94?._ak44v7)await loadScript(asset('bare-mux/bare-mux.js'));
  if(!window._0zzl94?._ak44v7)throw new Error('Local proxy transport helper is unavailable.');
  mux=new window._0zzl94._ak44v7(asset('bare-mux/bare-mux-worker.js').href);
  let wisp='wss://anura.pro/wisp/';
  try{const response=await fetch(asset('wisp.txt').href,{cache:'no-store'});if(response.ok){const match=(await response.text()).match(/WISP URL:\s*(\S+)/i);if(match&&/^wss:\/\//i.test(match[1]))wisp=match[1]}}catch(_){}
  await mux.setTransport(asset('transport/epoxy.mjs').href,[{wisp}]);
 }
 function ensureSetup(){if(!setupPromise)setupPromise=setup().catch(error=>{setupPromise=null;throw error});return setupPromise}
 function safeTarget(raw){const target=new URL(raw);if(target.protocol!=='https:'||target.hostname!=='lichess.org'||!target.pathname.startsWith('/api/'))throw new Error('Bridge only allows HTTPS lichess.org /api/ requests.');return target}
 async function handleRequest(message){
  const id=message.id,abort=new AbortController();activeRequests.set(id,abort);
  try{
   await ensureSetup();
   const target=safeTarget(message.url),proxiedUrl=controller.encodeUrl(target.href),method=message.method||'GET';
   const response=await fetch(proxiedUrl,{method,headers:message.headers||{},body:method==='GET'||method==='HEAD'?undefined:(message.body||''),credentials:'omit',cache:'no-store',signal:abort.signal});
   if(!message.stream){send({type:'response',id,status:response.status,ok:response.ok,body:await response.text()});return}
   send({type:'headers',id,status:response.status,ok:response.ok});
   if(!response.body){send({type:'end',id});return}
   const reader=response.body.getReader(),decoder=new TextDecoder();
   while(true){const result=await reader.read();if(result.done)break;const chunk=decoder.decode(result.value,{stream:true});if(chunk)send({type:'chunk',id,chunk})}
   const tail=decoder.decode();if(tail)send({type:'chunk',id,chunk:tail});
   send({type:'end',id});
  }catch(error){if(!abort.signal.aborted)send({type:'error',id,message:String(error?.message||error)});else send({type:'end',id})}
  finally{activeRequests.delete(id)}
 }
 window.addEventListener('message',event=>{
  if(event.source!==parent||event.origin!==location.origin)return;
  const message=event.data||{};
  if(message.type==='abort'){activeRequests.get(message.id)?.abort();return}
  if(message.type==='request'&&message.id)handleRequest(message);
 });
 ensureSetup().then(()=>send({type:'ready'})).catch(error=>send({type:'ready-error',message:String(error?.message||error)}));
})();
</script></body></html>
