<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>HummingWeb</title>
  <script>
    (() => {
      let path = window.location.pathname;
      while (path.length > 1 && path.endsWith('/')) path = path.slice(0, -1);
      const params = new URLSearchParams(window.location.search);
      if (path === '/web.html/search') {
        if (params.has('q')) {
          const target = new URL('https://ghp.hummingbird.rf.gd/HummingEngine/');
          for (const key of ['q', 'open', 'popup']) {
            if (params.has(key)) target.searchParams.set(key, params.get(key) || '');
          }
          window.location.replace(target.href);
          return;
        }
        window.location.replace('/web.html');
        return;
      }
    })();
  </script>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0a2e0a; color:#e0f7e0; font:16px system-ui,sans-serif; }
    main { max-width:32rem; padding:2rem; text-align:center; }
    a { color:#90e4c1; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>The page you requested does not exist.</p>
    <p><a href="/">Return to humming[bird]Tech</a></p>
  </main>
</body>
</html>
